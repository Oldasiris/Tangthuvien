<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>MySpace AI Hub</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg-main: #090d16; --bg-sidebar: #0d1320; --bg-card: rgba(17, 24, 39, 0.88);
      --bg-input: rgba(31, 41, 55, 0.88); --border: #283548; --primary: #3b82f6;
      --accent: #8b5cf6; --text-main: #f8fafc; --text-muted: #94a3b8;
      --bg-image: none; --glass: blur(12px);
    }
    :root[data-theme="light"] {
      --bg-main: #f1f5f9; --bg-sidebar: rgba(255, 255, 255, 0.92); --bg-card: rgba(255, 255, 255, 0.88);
      --bg-input: rgba(248, 250, 252, 0.92); --border: #cbd5e1; --primary: #2563eb;
      --accent: #7c3aed; --text-main: #0f172a; --text-muted: #64748b;
      --bg-image: none; --glass: blur(12px);
    }
    :root[data-theme="anime"] {
      --bg-main: #130b24; --bg-sidebar: rgba(20, 14, 38, 0.82);
      --bg-card: rgba(26, 18, 48, 0.78); --bg-input: rgba(38, 27, 68, 0.82);
      --border: rgba(244, 114, 182, 0.35); --primary: #ec4899;
      --accent: #a855f7; --text-main: #fdf2f8; --text-muted: #f9a8d4;
      --bg-image: linear-gradient(rgba(15, 10, 30, 0.6), rgba(15, 10, 30, 0.7)), url('https://unsplash.com');
      --glass: blur(14px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-main); background-image: var(--bg-image); background-size: cover; background-position: center; background-attachment: fixed; color: var(--text-main); display: flex; height: 100dvh; overflow: hidden; transition: 0.3s; }
    .sidebar { width: 245px; background: var(--bg-sidebar); backdrop-filter: var(--glass); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 14px 10px; gap: 6px; flex-shrink: 0; transition: width 0.25s; z-index: 20; }
    .sidebar.collapsed { width: 68px; align-items: center; }
    .sidebar.collapsed .nav-text, .sidebar.collapsed .brand-text, .sidebar.collapsed .theme-box, .sidebar.collapsed .music-title, .sidebar.collapsed .quota-box { display: none !important; }
    .brand { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 4px 8px 12px; border-bottom: 1px solid var(--border); margin-bottom: 4px; font-weight: 700; }
    .sidebar.collapsed .brand { justify-content: center; padding: 4px 0 12px; }
    .toggle-btn { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main); width: 32px; height: 32px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .nav-item { display: flex; align-items: center; gap: 11px; width: 100%; padding: 10px 13px; border-radius: 12px; color: var(--text-muted); background: transparent; border: 1px solid transparent; font-size: 0.88rem; cursor: pointer; white-space: nowrap; overflow: hidden; }
    .sidebar.collapsed .nav-item { justify-content: center; padding: 12px 0; }
    .nav-item.active { background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(236,72,153,0.18)); color: var(--primary); border-color: var(--border); font-weight: 600; }
    .quota-box { background: var(--bg-input); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; margin-top: auto; font-size: 0.75rem; width: 100%; }
    .quota-bar-bg { width: 100%; height: 6px; background: rgba(128,128,128,0.25); border-radius: 6px; overflow: hidden; margin-top: 5px; }
    .quota-bar-fill { height: 100%; width: 0%; background: var(--primary); transition: width 0.4s; }
    .quota-bar-fill.warn { background: #ef4444; }
    .mini-player { background: var(--bg-input); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; display: flex; align-items: center; justify-content: space-between; gap: 6px; width: 100%; }
    .sidebar.collapsed .mini-player { flex-direction: column; padding: 6px 4px; background: transparent; border: none; }
    .music-btn { background: var(--primary); color: #fff; border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 0.78rem; flex-shrink: 0; }
    .music-title { font-size: 0.78rem; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .theme-box { padding-top: 6px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 5px; width: 100%; }
    .theme-btns { display: flex; gap: 5px; }
    .theme-btn { flex: 1; padding: 5px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text-main); cursor: pointer; font-size: 0.75rem; font-weight: 600; }
    .theme-btn.active { border-color: var(--primary); background: var(--primary); color: #fff; }
    .bg-change-btn { width: 100%; padding: 6px; border-radius: 8px; border: 1px dashed var(--primary); background: rgba(59,130,246,0.12); color: var(--text-main); font-size: 0.76rem; cursor: pointer; display: block; font-weight: 500; }
    .main-area { flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; }
    .tab-pane { display: none; flex-direction: column; height: 100%; overflow: hidden; }
    .tab-pane.active { display: flex; }
    .top-bar { padding: 12px 18px; background: var(--bg-card); backdrop-filter: var(--glass); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .scroll-body { flex: 1; overflow-y: auto; padding: 16px 18px; }
    .box, .book-card, .media-card, .lock-card, .song-item { background: var(--bg-card); backdrop-filter: var(--glass); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
    input[type="text"], input[type="password"], textarea { width: 100%; background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main); padding: 10px 13px; border-radius: 10px; font-size: 0.9rem; margin-bottom: 10px; }
    textarea { resize: vertical; min-height: 75px; }
    .row-actions { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .file-btn { background: var(--bg-input); border: 1px dashed var(--border); color: var(--text-muted); padding: 8px 12px; border-radius: 10px; font-size: 0.83rem; cursor: pointer; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn { background: var(--primary); color: #fff; border: none; padding: 8px 15px; border-radius: 10px; font-weight: 600; font-size: 0.85rem; cursor: pointer; flex-shrink: 0; }
    .btn:disabled { opacity: 0.5; }
    .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 5px 10px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; font-weight: 600; }
    .btn-danger { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); padding: 4px 10px; font-size: 0.75rem; border-radius: 8px; cursor: pointer; }
    .ai-search-bar { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; }
    .ai-search-bar input { margin-bottom: 0; border-radius: 22px; padding-left: 16px; }
    .mic-btn { background: linear-gradient(135deg, #ec4899, #8b5cf6); color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 1.05rem; cursor: pointer; flex-shrink: 0; }
    .mic-btn.listening { animation: pulse 1s infinite; background: #ef4444; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }
    .ai-tag-badge { font-size: 0.72rem; color: var(--accent); background: rgba(139,92,246,0.14); padding: 4px 8px; border-radius: 8px; line-height: 1.4; }
    .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 999; align-items: center; justify-content: center; padding: 20px; }
    .lightbox img { max-width: 95%; max-height: 90dvh; border-radius: 12px; }
    .lock-screen { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    .lock-card { max-width: 340px; width: 100%; padding: 24px 18px; }
    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
    .media-card { margin-bottom: 0; display: flex; flex-direction: column; gap: 8px; }
    .media-card img, .media-card video { width: 100%; height: 195px; object-fit: cover; border-radius: 10px; background: #000; cursor: zoom-in; }
    .tag-bar { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 12px; }
    .tag-chip { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-muted); padding: 5px 11px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; }
    .tag-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .book-card { position: relative; }
    .book-title { font-size: 1.05rem; font-weight: 700; color: var(--primary); margin-bottom: 6px; padding-right: 45px; }
    .book-tag { background: rgba(168,85,247,0.18); color: var(--accent); padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; margin-right: 5px; display: inline-block; margin-bottom: 6px; }
    .reader-box.sepia { background: #f4ecd8 !important; color: #3b2f2f !important; border-color: #d6c7a9 !important; }
    .reader-text { font-size: 16px; line-height: 1.85; white-space: pre-wrap; padding: 10px 0; }
    .song-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px; margin-bottom: 10px; }
    .chat-box { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
    .chat-msg { max-width: 80%; background: var(--bg-card); backdrop-filter: var(--glass); border: 1px solid var(--border); padding: 8px 12px; border-radius: 14px; align-self: flex-start; cursor: pointer; }
    .chat-msg.me { background: var(--primary); color: #fff; border-color: var(--primary); align-self: flex-end; }
    .chat-sender { font-size: 0.7rem; opacity: 0.8; margin-bottom: 3px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
    .chat-msg img { max-width: 100%; max-height: 230px; border-radius: 10px; margin-top: 6px; display: block; }
    .reply-banner { background: var(--bg-input); border-left: 3px solid var(--primary); padding: 6px 12px; font-size: 0.78rem; display: none; justify-content: space-between; align-items: center; }
    .chat-footer { padding: 8px 10px; background: var(--bg-card); backdrop-filter: var(--glass); border-top: 1px solid var(--border); display: flex; gap: 6px; align-items: center; }
    .chat-footer input[type="text"] { margin-bottom: 0; border-radius: 20px; flex: 1; min-width: 0; }
    .chat-icon-btn { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main); width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-size: 1.05rem; }
    .chat-icon-btn.has-file { border-color: #22c55e; background: rgba(34,197,94,0.2); }
    @media (max-width: 768px) {
      body { flex-direction: column; }
      .sidebar { width: 100% !important; height: 60px; flex-direction: row !important; padding: 4px; border-right: none; border-top: 1px solid var(--border); order: 2; align-items: center; justify-content: space-around; }
      .brand, .music-title, .quota-box, .theme-box, .mini-player { display: none !important; }
      .nav-item { flex: 1; flex-direction: column; gap: 2px; padding: 4px 2px !important; font-size: 0.65rem; justify-content: center !important; }
      .nav-text { display: inline !important; }
      .main-area { order: 1; height: calc(100dvh - 60px); }
      .scroll-body { padding: 12px; }
    }
  </style>
</head>
<body>
  <div class="lightbox" id="imgLightbox" onclick="this.style.display='none'">
    <img id="lightboxImg" src="">
  </div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-text">⚡ MySpace AI</span>
      <button class="toggle-btn" onclick="toggleMenu()">☰</button>
    </div>
    <button class="nav-item active" onclick="openTab('vault', this)"><span>🔒</span><span class="nav-text">Kho ảnh AI</span></button>
    <button class="nav-item" onclick="openTab('library', this)"><span>📚</span><span class="nav-text">Tàng thư viện</span></button>
    <button class="nav-item" onclick="openTab('music', this)"><span>🎵</span><span class="nav-text">Kho nhạc</span></button>
    <button class="nav-item" onclick="openTab('chat', this)"><span>💬</span><span class="nav-text">Phòng chat</span></button>
    <button class="nav-item" onclick="openTab('tools', this)"><span>⏱️</span><span class="nav-text">Tiện ích</span></button>

    <div class="quota-box">
      <div class="quota-details" style="display:flex; justify-content:space-between;">
        <span>💾 Kho lưu trữ</span>
        <span id="quotaText">0 / 1024 MB</span>
      </div>
      <div class="quota-bar-bg"><div class="quota-bar-fill" id="quotaFill"></div></div>
    </div>

    <div class="mini-player">
      <button class="music-btn" id="miniPlayBtn" onclick="toggleMiniPlay()">▶</button>
      <span class="music-title" id="miniSongTitle">Chưa chọn nhạc</span>
      <button class="toggle-btn" style="width:26px; height:26px; font-size:0.75rem;" onclick="playNextSong()">⏭</button>
    </div>
    <div id="ytHiddenBox" style="width:0; height:0; overflow:hidden;"></div>
    <audio id="mp3Player" onended="playNextSong()"></audio>

    <div class="theme-box">
      <div class="theme-btns" style="margin-bottom:3px;">
        <button class="theme-btn active" id="lang-vi" onclick="setLang('vi')">🇻🇳 VN</button>
        <button class="theme-btn" id="lang-ja" onclick="setLang('ja')">🇯🇵 JP</button>
      </div>
      <div class="theme-btns">
        <button class="theme-btn active" id="th-dark" onclick="setTheme('dark')">🌙</button>
        <button class="theme-btn" id="th-light" onclick="setTheme('light')">☀️</button>
        <button class="theme-btn" id="th-anime" onclick="setTheme('anime')">🌸</button>
      </div>
      <button class="bg-change-btn" id="customBgBtn" onclick="changeAnimeBg()">🖼️ Đổi ảnh nền</button>
    </div>
  </aside>

  <main class="main-area">
    <section id="tab-vault" class="tab-pane active">
      <div class="top-bar">
        <h2 id="vaultHeaderTitle" style="font-size:1rem;">🔒 Kho Ảnh AI</h2>
        <div style="display:flex; gap:5px; align-items:center;">
          <button class="btn-outline" style="padding:4px 7px; font-size:0.72rem;" onclick="cycleThemeMobile()">🎨</button>
          <button class="btn-outline" style="padding:4px 7px; font-size:0.72rem;" onclick="toggleLangMobile()">🇻🇳/🇯🇵</button>
          <button class="btn-outline" style="padding:4px 7px; font-size:0.72rem;" onclick="setGeminiKey()">🔑</button>
          <button class="btn-danger" id="lockBtn" style="display:none;" onclick="lockVault()">🔒</button>
        </div>
      </div>
      <div id="vaultLockScreen" class="lock-screen">
        <div class="lock-card">
          <div style="font-size:2.2rem; margin-bottom:8px;">🛡️</div>
          <h3 style="margin-bottom:14px;">Khu vực riêng tư</h3>
          <input type="text" id="vaultUser" placeholder="Tên tài khoản...">
          <input type="password" id="pinInput" placeholder="Mã PIN bí mật..." onkeypress="if(event.key==='Enter') unlockVault()">
          <button class="btn" style="width:100%;" onclick="unlockVault()">Mở kho của tôi</button>
        </div>
      </div>
      <div id="vaultContent" class="scroll-body" style="display:none;">
        <div class="ai-search-bar">
          <input type="text" id="aiSearchInput" placeholder="Mô tả ảnh nhớ mang máng..." oninput="filterVaultByAI()">
          <button class="mic-btn" id="voiceMicBtn" onclick="startVoiceSearch()">🎙️</button>
        </div>
        <div id="aiVoiceStatus" style="font-size:0.8rem; color:var(--primary); margin-bottom:12px; display:none;"></div>
        <div class="box">
          <input type="text" id="vaultNote" placeholder="Ghi chú thêm (AI tự động phân tích ảnh)...">
          <div class="row-actions">
            <label for="vaultFile" class="file-btn" id="vaultFileLabel">📎 Chọn 1 hoặc nhiều ảnh/video</label>
            <input type="file" id="vaultFile" accept="image/*,video/*" multiple onchange="showMultiNames()">
            <button class="btn" id="vaultSaveBtn" onclick="uploadVault()">Lưu & AI quét</button>
          </div>
        </div>
        <div class="media-grid" id="vaultFeed"></div>
      </div>
    </section>
    <section id="tab-library" class="tab-pane">
      <div class="top-bar">
        <h2 id="libHeaderTitle" style="font-size:1rem;">📚 Tàng thư viện</h2>
        <button class="btn-outline" id="backToBooksBtn" style="display:none;" onclick="closeReader()">← Danh sách</button>
      </div>
      <div id="libraryListView" class="scroll-body">
        <div class="box">
          <input type="text" id="bookTitle" placeholder="Tên bộ truyện...">
          <input type="text" id="bookTags" placeholder="Tag thể loại (VD: Tiên hiệp, Anime)">
          <textarea id="bookSummary" placeholder="Tóm tắt cơ bản..."></textarea>
          <textarea id="bookReview" placeholder="Review & Đánh giá..."></textarea>
          <div class="row-actions">
            <label for="bookFile" class="file-btn" id="bookFileLabel">🖼️ Ảnh bìa / File</label>
            <input type="file" id="bookFile" onchange="showName('bookFile','bookFileLabel','🖼️ Ảnh bìa / File')">
            <button class="btn" id="bookSaveBtn" onclick="addBook()">Tạo truyện</button>
          </div>
        </div>
        <div class="tag-bar" id="tagFilterBar"></div>
        <div id="libraryFeed"></div>
      </div>
      <div id="chapterReaderView" class="scroll-body" style="display:none;">
        <div class="box">
          <h4 style="margin-bottom:8px; color:var(--primary);">➕ Thêm chương / trang mới</h4>
          <input type="text" id="chapTitle" placeholder="Tên chương (VD: Chương 1)">
          <textarea id="chapContent" placeholder="Dán nội dung chữ (hoặc chọn trang ảnh)..."></textarea>
          <div class="row-actions">
            <label for="chapImg" class="file-btn" id="chapImgLabel">🖼️ Chọn trang ảnh</label>
            <input type="file" id="chapImg" accept="image/*" onchange="showName('chapImg','chapImgLabel','🖼️ Chọn trang ảnh')">
            <button class="btn" id="chapSaveBtn" onclick="addChapter()">Đăng chương</button>
          </div>
        </div>
        <div id="chapterListBar" class="tag-bar"></div>
        <div class="box reader-box" id="chapterDisplayBox" style="display:none;">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px; border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:10px;">
            <h3 id="currentChapHeading" style="color:var(--primary); font-size:1rem;"></h3>
            <div style="display:flex; gap:5px;">
              <button class="btn-outline" onclick="changeFontSize(-2)">A-</button>
              <button class="btn-outline" onclick="changeFontSize(2)">A+</button>
              <button class="btn-outline" onclick="toggleSepia()">📜</button>
              <button class="btn-danger" id="delChapBtn">🗑️</button>
            </div>
          </div>
          <div id="currentChapMedia"></div>
          <div id="currentChapText" class="reader-text"></div>
          <div style="display:flex; justify-content:space-between; margin-top:18px; padding-top:10px; border-top:1px solid var(--border);">
            <button class="btn-outline" onclick="navChapter(-1)">← Trước</button>
            <button class="btn-outline" onclick="navChapter(1)">Sau →</button>
          </div>
        </div>
      </div>
    </section>
    <section id="tab-music" class="tab-pane">
      <div class="top-bar">
        <h2 style="font-size:1rem;">🎵 Kho nhạc</h2>
        <span id="mobileQuotaBadge" style="font-size:0.75rem; color:var(--text-muted);"></span>
      </div>
      <div class="scroll-body">
        <div class="box">
          <input type="text" id="songTitle" placeholder="Tên bài hát...">
          <input type="text" id="songPlaylist" placeholder="Tên Playlist (VD: Anime Chill, Remix)">
          <input type="text" id="songYtUrl" placeholder="Dán link YouTube (Tốn 0MB)...">
          <div class="row-actions">
            <label for="songFile" class="file-btn" id="songFileLabel">🎧 Hoặc file MP3</label>
            <input type="file" id="songFile" accept="audio/*" onchange="showName('songFile','songFileLabel','🎧 Hoặc file MP3')">
            <button class="btn" id="songSaveBtn" onclick="addSong()">Thêm nhạc</button>
          </div>
        </div>
        <div class="tag-bar" id="playlistFilterBar"></div>
        <div id="songListFeed"></div>
      </div>
    </section>

    <section id="tab-chat" class="tab-pane">
      <div class="top-bar">
        <h2 style="font-size:1rem;">💬 Phòng chat</h2>
        <input type="text" id="chatSender" placeholder="Tên bạn..." onchange="saveChatName()" style="width:115px; margin:0; padding:5px 9px; font-size:0.8rem;">
      </div>
      <div class="chat-box" id="chatBox"></div>
      <div class="reply-banner" id="replyBanner">
        <span id="replyPreviewText" style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></span>
        <button onclick="cancelReply()" style="background:none; border:none; color:#ef4444; cursor:pointer; font-weight:700; padding-left:8px;">✕</button>
      </div>
      <div class="chat-footer">
        <label for="chatImg" class="chat-icon-btn" id="chatImgBtn" title="Gửi ảnh">🖼️</label>
        <input type="file" id="chatImg" accept="image/*" style="display:none;" onchange="onChatImgPicked()">
        <input type="text" id="chatText" placeholder="Nhắn tin..." onkeypress="if(event.key==='Enter') sendChat()">
        <button class="btn" id="chatSendBtn" onclick="sendChat()">Gửi</button>
      </div>
    </section>

    <section id="tab-tools" class="tab-pane">
      <div class="top-bar"><h2 id="toolsHeaderTitle" style="font-size:1rem;">⏱️ Tập trung & Ghi chú</h2></div>
      <div class="scroll-body">
        <div class="box" style="text-align:center;">

  <script>
    const PROJECT_ID = 'pasqbzlazciysmecmkbu';
    const SUPABASE_URL = 'https://' + PROJECT_ID + '.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhc3FiemxhemNpeXNtZWNta2J1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5MDgxOTMsImV4cCI6MjExMDQ4NDE5M30.Ofw8dY0w1Fd0ZpP9Exg8gecfq2cjMern-Y41gNakG7c';
    let GEMINI_KEY = localStorage.getItem('myspace_gemini_key') || '';
    let currentLang = localStorage.getItem('myspace_lang') || 'vi';

    const readHeaders = { 'apikey': SUPABASE_KEY };
    const writeHeaders = { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' };

    function setGeminiKey() {
      const msg = currentLang === 'ja' ? 'Google Gemini API Keyを入力してください：' : 'Dán mã Google Gemini API Key của bạn vào đây:';
      const k = prompt(msg, GEMINI_KEY);
      if (k !== null && k.trim()) {

    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('imgLightbox').style.display = 'flex';
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',').pop());
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function analyzeImageWithAI(file) {
      if (!file || !file.type.startsWith('image/')) return currentLang === 'ja' ? '動画 / メディア' : 'Video / Tệp đa phương tiện';
      if (!GEMINI_KEY) return file.name;
      try {
        const base64Data = await fileToBase64(file);
        const promptText = currentLang === 'ja'
          ? "この画像を日本語で簡潔に説明してください（背景、物体、色、文字などをカンマ区切りで出力）。"
          : "Mô tả ngắn gọn bức ảnh này bằng tiếng Việt (bối cảnh, đồ vật, màu sắc, chữ viết nếu có) dưới dạng từ khóa cách nhau dấu phẩy.";

        const res = await fetch(`https://googleapis.com{encodeURIComponent(GEMINI_KEY)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: promptText }, { inline_data: { mime_type: file.type, data: base64Data } }] }] })
        });
        if (!res.ok) return file.name;
        const data = await res.json();
        const cand = data.candidates ? data.candidates.at(0) : null;
        const part = cand && cand.content && cand.content.parts ? cand.content.parts.at(0) : null;
        return (part && part.text) ? part.text.trim() : file.name;
      } catch (e) { return file.name; }
    }
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = (currentLang === 'ja') ? 'ja-JP' : 'vi-VN';
        utter.rate = 1.05;
        window.speechSynthesis.speak(utter);
      }
    }

    function startVoiceSearch() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) return alert(currentLang === 'ja' ? 'Chromeをご利用ください。' : 'Hãy dùng Chrome để dùng Micro nhé!');
      const rec = new SpeechRec();
      rec.lang = (currentLang === 'ja') ? 'ja-JP' : 'vi-VN';
      const btn = document.getElementById('voiceMicBtn');
      const status = document.getElementById('aiVoiceStatus');

      btn.classList.add('listening');
      status.style.display = 'block';
      status.textContent = (currentLang === 'ja') ? '🎙️ 聞いています...' : '🎙️ Đang nghe mô tả ảnh...';

      rec.onresult = (event) => {
        const spoken = event.results.item(0).item(0).transcript;
        const cleanQuery = (currentLang === 'ja')
          ? spoken.replace(/(の写真を探して|を探して|を見せて|検索)\s*/g, '').trim()
          : spoken.replace(/^(tìm cho tôi|tìm ảnh|kiếm ảnh|mở ảnh|cho xem ảnh|tìm)\s*/i, '').trim();

        const isAll = ['tất cả', 'すべて', '全部'].includes(cleanQuery.toLowerCase());
        document.getElementById('aiSearchInput').value = isAll ? '' : cleanQuery;
        const count = filterVaultByAI();

        const reply = (currentLang === 'ja') ? `「${cleanQuery}」に一致する写真が${count}件見つかりました` : `Tìm thấy ${count} kết quả cho ${cleanQuery}`;
        status.textContent = `🤖 AI: "${reply}" (${spoken})`;
        speakText(reply);
      };

      rec.onerror = () => { status.textContent = '⚠️ Thử lại nhé!'; };
      rec.onend = () => btn.classList.remove('listening');
      rec.start();
    }

    async function checkStorageQuota() {
      try {
        const res = await fetch(`${SUPABASE_URL}/storage/v1/object/list/media`, {
          method: 'POST', headers: writeHeaders, body: JSON.stringify({ limit: 1000, offset: 0 })
        });
        if (!res.ok) return;
        const files = await res.json();
        let totalBytes = 0;
        files.forEach(f => { if (f.metadata && f.metadata.size) totalBytes += f.metadata.size; });
        const usedMB = (totalBytes / (1024 * 1024)).toFixed(1);
        const percent = Math.min(100, (usedMB / 1024) * 100).toFixed(1);
        document.getElementById('quotaText').textContent = `${usedMB} / 1024 MB`;
        document.getElementById('mobileQuotaBadge').textContent = `💾 ${usedMB}MB / 1GB`;
        const fill = document.getElementById('quotaFill');
        fill.style.width = percent + '%';
        if (percent >= 80) fill.classList.add('warn');
      } catch (e) {}
    }
    function applyCustomBg() {
      const url = localStorage.getItem('myspace_anime_bg');
      const theme = document.documentElement.getAttribute('data-theme');
      if (url) {
        const overlay = (theme === 'light') ? 'rgba(255, 255, 255, 0.78)' : 'rgba(12, 16, 28, 0.72)';
        document.documentElement.style.setProperty('--bg-image', `linear-gradient(${overlay}, ${overlay}), url('${url}')`);
      } else document.documentElement.style.removeProperty('--bg-image');
    }

    function changeAnimeBg() {
      const msg = currentLang === 'ja' ? '背景画像のURL（空欄で初期設定に戻す）：' : 'Dán link ảnh nền (để trống để về mặc định):';
      const newUrl = prompt(msg, localStorage.getItem('myspace_anime_bg') || '');
      if (newUrl === null) return;
      if (newUrl.trim()) localStorage.setItem('myspace_anime_bg', newUrl.trim());
      else localStorage.removeItem('myspace_anime_bg');
      applyCustomBg();
    }

    function setTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem('myspace_theme', t);
      document.querySelectorAll('.theme-btn').forEach(b => { if (b.id.startsWith('th-')) b.classList.remove('active'); });
      if (document.getElementById('th-' + t)) document.getElementById('th-' + t).classList.add('active');
      applyCustomBg();
    }

    function cycleThemeMobile() {
      const order = ['dark', 'light', 'anime'];
      const cur = document.documentElement.getAttribute('data-theme') || 'dark';
      setTheme(order.at((order.indexOf(cur) + 1) % order.length));
    }

    function toggleLangMobile() { setLang(currentLang === 'vi' ? 'ja' : 'vi'); }

    function toggleMenu() {
      const sb = document.getElementById('sidebar');
      sb.classList.toggle('collapsed');
      localStorage.setItem('myspace_collapsed', sb.classList.contains('collapsed'));
    }

    setTheme(localStorage.getItem('myspace_theme') || 'dark');
    if (localStorage.getItem('myspace_collapsed') === 'true') document.getElementById('sidebar').classList.add('collapsed');

    function openTab(tabName, el) {
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById('tab-' + tabName).classList.add('active');
      el.classList.add('active');
      if (tabName === 'chat') document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
    }

    function showName(inpId, lblId, def) {
      const f = document.getElementById(inpId).files.item(0);
      document.getElementById(lblId).textContent = f ? ('✅ ' + f.name) : def;
    }

    function showMultiNames() {
      const files = document.getElementById('vaultFile').files;
      const lbl = document.getElementById('vaultFileLabel');
      if (files.length === 0) lbl.textContent = dict[currentLang].pickMedia;
      else if (files.length === 1) lbl.textContent = '✅ ' + files.item(0).name;
      else lbl.textContent = currentLang === 'ja' ? `✅ ${files.length}件選択中` : `✅ Đã chọn ${files.length} tệp`;
    }

    async function uploadFileToCloud(file) {
      if (!file || !file.name) throw new Error('Invalid file');
      if (file.size > 50 * 1024 * 1024) throw new Error('File > 50MB!');
      const safeName = Date.now() + '_' + Math.random().toString(36).substring(2,6) + '_' + file.name.replace(/[^a-zA-Z0-9.]/g, '_');
      const res = await fetch(`${SUPABASE_URL}/storage/v1/object/media/${safeName}`, {
        method: 'POST', headers: { 'apikey': SUPABASE_KEY, 'Content-Type': file.type || 'application/octet-stream' }, body: file
      });
      if (!res.ok) throw new Error(await res.text());
      checkStorageQuota();
      return `${SUPABASE_URL}/storage/v1/object/public/media/${safeName}`;
    }
    let currentOwnerKey = '', allVaultItems = [];
    document.getElementById('vaultUser').value = localStorage.getItem('myspace_username') || '';

    function unlockVault() {
      const user = document.getElementById('vaultUser').value.trim();
      const pin = document.getElementById('pinInput').value.trim();
      if (!user || !pin) return alert(currentLang === 'ja' ? '名前とPINを入力してください！' : 'Nhập đủ Tên và Mã PIN!');
      localStorage.setItem('myspace_username', user);
      document.getElementById('chatSender').value = user;
      saveChatName();
      currentOwnerKey = user.toLowerCase() + ':' + pin;
      document.getElementById('vaultHeaderTitle').textContent = '🔒 ' + user;
      document.getElementById('vaultLockScreen').style.display = 'none';
      document.getElementById('vaultContent').style.display = 'block';
      document.getElementById('lockBtn').style.display = 'inline-block';
      document.getElementById('pinInput').value = '';
      loadVault();
    }

    function lockVault() {
      currentOwnerKey = '';
      document.getElementById('vaultHeaderTitle').textContent = dict[currentLang].vaultTitle;
      document.getElementById('vaultLockScreen').style.display = 'flex';
      document.getElementById('vaultContent').style.display = 'none';
      document.getElementById('lockBtn').style.display = 'none';
    }

    async function loadVault() {
      if (!currentOwnerKey) return;
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/posts?owner=eq.${encodeURIComponent(currentOwnerKey)}&select=*&order=id.desc`, { headers: readHeaders });
        if (!res.ok) return;
        allVaultItems = await res.json();
        filterVaultByAI();
      } catch (e) {}
    }

    function filterVaultByAI() {
      const q = document.getElementById('aiSearchInput').value.trim().toLowerCase();
      const feed = document.getElementById('vaultFeed'); feed.innerHTML = '';
      const matched = !q ? allVaultItems : allVaultItems.filter(item => {
        const hay = ((item.content || '') + ' ' + (item.ai_tags || '')).toLowerCase();
        return q.split(' ').every(word => hay.includes(word));
      });
      matched.forEach(item => {
        const div = document.createElement('div'); div.className = 'media-card';
        const media = item.media_url ? ((item.media_type && item.media_type.startsWith('video/')) ? `<video src="${item.media_url}" controls playsinline></video>` : `<img src="${item.media_url}" loading="lazy" onclick="openLightbox('${item.media_url}')">`) : '';
        div.innerHTML = `
          ${media}
          ${item.content ? `<p style="font-size:0.88rem; font-weight:500;">${item.content}</p>` : ''}
          ${item.ai_tags ? `<div class="ai-tag-badge">✨ AI: ${item.ai_tags}</div>` : ''}
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top:auto;">
            <span style="font-size:0.72rem; color:var(--text-muted);">${new Date(item.created_at).toLocaleDateString('vi-VN')}</span>
            <button class="btn-danger" onclick="deleteItem('posts', ${item.id}, loadVault)">🗑️</button>
          </div>`;
        feed.appendChild(div);
      });
      return matched.length;
    }

    async function uploadVault() {
      const note = document.getElementById('vaultNote').value.trim();
      const files = document.getElementById('vaultFile').files;
      if (!note && files.length === 0) return;
      const btn = document.getElementById('vaultSaveBtn'); btn.disabled = true;
      try {
        if (files.length === 0) {
          btn.textContent = '⏳...';
          await fetch(`${SUPABASE_URL}/rest/v1/posts`, { method: 'POST', headers: writeHeaders, body: JSON.stringify({ content: note, owner: currentOwnerKey, ai_tags: note }) });
        } else {
          for (let i = 0; i < files.length; i++) {
            const f = files.item(i);
            btn.textContent = `AI (${i + 1}/${files.length})...`;
            const url = await uploadFileToCloud(f);
            const aiDesc = await analyzeImageWithAI(f);
            await fetch(`${SUPABASE_URL}/rest/v1/posts`, { method: 'POST', headers: writeHeaders, body: JSON.stringify({ content: note, media_url: url, media_type: f.type, owner: currentOwnerKey, ai_tags: aiDesc }) });
          }
        }
        document.getElementById('vaultNote').value = ''; document.getElementById('vaultFile').value = '';
        showMultiNames();
        loadVault();
      } catch (e) { alert('Lỗi: ' + e.message); } finally { btn.disabled = false; btn.textContent = dict[currentLang].saveAiBtn; }
    }
    let allBooks = [], activeTag = 'All', currentBookId = null, bookChapters = [], currentChapIdx = 0, readerFontSize = 16;

    function changeFontSize(delta) {
      readerFontSize = Math.max(12, Math.min(28, readerFontSize + delta));
      document.getElementById('currentChapText').style.fontSize = readerFontSize + 'px';
    }

    function toggleSepia() { document.getElementById('chapterDisplayBox').classList.toggle('sepia'); }

    async function loadLibrary() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/library?select=*&order=id.desc`, { headers: readHeaders });
        if (!res.ok) return;
        allBooks = await res.json();
        renderTags(); renderBooks();
      } catch (e) {}
    }

    function renderTags() {
      const tagSet = new Set(['All']);
      allBooks.forEach(b => { if (b.tags) b.tags.split(',').forEach(t => { if (t.trim()) tagSet.add(t.trim()); }); });
      const bar = document.getElementById('tagFilterBar'); bar.innerHTML = '';
      tagSet.forEach(tag => {
        const chip = document.createElement('button');
        chip.className = 'tag-chip' + (activeTag === tag ? ' active' : '');
        chip.textContent = tag === 'All' ? (currentLang === 'ja' ? 'すべて' : 'Tất cả') : tag;
        chip.onclick = () => { activeTag = tag; renderTags(); renderBooks(); };
        bar.appendChild(chip);
      });
    }

    function renderBooks() {
      const feed = document.getElementById('libraryFeed'); feed.innerHTML = '';
      const filtered = activeTag === 'All' ? allBooks : allBooks.filter(b => b.tags && b.tags.toLowerCase().includes(activeTag.toLowerCase()));
      filtered.forEach(b => {
        const tagsHTML = (b.tags || '').split(',').filter(t => t.trim()).map(t => `<span class="book-tag">#${t.trim()}</span>`).join('');
        const savedChap = localStorage.getItem('read_prog_' + b.id);
        const progBadge = savedChap !== null ? `<span style="font-size:0.75rem; color:#22c55e;">📌 #${Number(savedChap) + 1}</span>` : '';
        const div = document.createElement('div'); div.className = 'book-card';
        const readBtnText = currentLang === 'ja' ? '📖 読む・話の追加' : '📖 Đọc & Thêm chương';
        div.innerHTML = `<button class="btn-danger" style="position:absolute; top:14px; right:14px;" onclick="deleteItem('library', ${b.id}, loadLibrary)">🗑️</button><div class="book-title">${b.title}</div><div>${tagsHTML} ${progBadge}</div>${b.summary ? `<p style="font-size:0.88rem; margin:6px 0;">${b.summary}</p>` : ''}${b.review ? `<p style="font-size:0.88rem; margin:6px 0; color:var(--text-muted);">${b.review}</p>` : ''}<div style="margin-top:12px; display:flex; gap:10px; align-items:center;"><button class="btn" onclick="openReader(${b.id}, '${b.title.replace(/'/g, "\\'")}')">${readBtnText}</button>${b.file_url ? `<a href="${b.file_url}" target="_blank" style="color:var(--primary); font-size:0.83rem;">📎 File</a>` : ''}</div>`;
        feed.appendChild(div);
      });
    }

    async function addBook() {
      const title = document.getElementById('bookTitle').value.trim();
      const tags = document.getElementById('bookTags').value.trim();
      const summary = document.getElementById('bookSummary').value.trim();
      const review = document.getElementById('bookReview').value.trim();
      const file = document.getElementById('bookFile').files.item(0);
      if (!title) return;
      const btn = document.getElementById('bookSaveBtn'); btn.disabled = true; btn.textContent = '⏳...';
      try {
        let fileUrl = file ? await uploadFileToCloud(file) : null;
        const res = await fetch(`${SUPABASE_URL}/rest/v1/library`, { method: 'POST', headers: writeHeaders, body: JSON.stringify({ title, tags, summary, review, file_url: fileUrl }) });
        if (!res.ok) throw new Error(await res.text());
        ['bookTitle','bookTags','bookSummary','bookReview','bookFile'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('bookFileLabel').textContent = dict[currentLang].bookFileLbl;
        loadLibrary();
      } catch (e) { alert('Lỗi: ' + e.message); } finally { btn.disabled = false; btn.textContent = dict[currentLang].bookSaveBtn; }
    }

    async function openReader(bookId, title) {
      currentBookId = bookId;
      currentChapIdx = Number(localStorage.getItem('read_prog_' + bookId) || 0);
      document.getElementById('libHeaderTitle').textContent = '📖 ' + title;
      document.getElementById('backToBooksBtn').style.display = 'inline-block';
      document.getElementById('libraryListView').style.display = 'none';
      document.getElementById('chapterReaderView').style.display = 'block';
      loadChapters();
    }

    function closeReader() {
      currentBookId = null;
      document.getElementById('libHeaderTitle').textContent = dict[currentLang].libTitle;
      document.getElementById('backToBooksBtn').style.display = 'none';
      document.getElementById('libraryListView').style.display = 'block';
      document.getElementById('chapterReaderView').style.display = 'none';
      renderBooks();
    }

    async function loadChapters() {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/chapters?book_id=eq.${currentBookId}&select=*&order=id.asc`, { headers: readHeaders });
      if (!res.ok) return;
      bookChapters = await res.json();
      const bar = document.getElementById('chapterListBar'); bar.innerHTML = '';
      bookChapters.forEach((c, idx) => {
        const b = document.createElement('button');
        b.className = 'tag-chip' + (idx === currentChapIdx ? ' active' : '');
        b.textContent = c.chapter_title || ('#' + (idx + 1));
        b.onclick = () => showChapter(idx);
        bar.appendChild(b);
      });
      if (bookChapters.length > 0) showChapter(Math.min(currentChapIdx, bookChapters.length - 1));
      else document.getElementById('chapterDisplayBox').style.display = 'none';
    }

    function showChapter(idx) {
      currentChapIdx = idx;
      if (currentBookId) localStorage.setItem('read_prog_' + currentBookId, idx);
      const chap = bookChapters.at(idx);
      document.getElementById('chapterDisplayBox').style.display = 'block';
      document.getElementById('currentChapHeading').textContent = chap.chapter_title || ('#' + (idx + 1));
      const isImg = chap.content && chap.content.startsWith('IMG_URL:');
      document.getElementById('currentChapMedia').innerHTML = isImg ? `<img src="${chap.content.replace('IMG_URL:','')}" style="max-width:100%; border-radius:10px;">` : '';
      document.getElementById('currentChapText').textContent = isImg ? '' : (chap.content || '');
      document.getElementById('delChapBtn').onclick = () => deleteItem('chapters', chap.id, loadChapters);
      document.querySelectorAll('#chapterListBar .tag-chip').forEach((el, i) => el.classList.toggle('active', i === idx));
    }

    function navChapter(step) {
      const next = currentChapIdx + step;
      if (next >= 0 && next < bookChapters.length) showChapter(next);
    }

    async function addChapter() {
      const title = document.getElementById('chapTitle').value.trim();
      let content = document.getElementById('chapContent').value.trim();
      const file = document.getElementById('chapImg').files.item(0);
      if (!title && !content && !file) return;
      const btn = document.getElementById('chapSaveBtn'); btn.disabled = true; btn.textContent = '⏳...';
      try {
        if (file) content = 'IMG_URL:' + await uploadFileToCloud(file);
        const res = await fetch(`${SUPABASE_URL}/rest/v1/chapters`, { method: 'POST', headers: writeHeaders, body: JSON.stringify({ book_id: currentBookId, chapter_title: title || ('#' + (bookChapters.length + 1)), content }) });
        if (!res.ok) throw new Error(await res.text());
        ['chapTitle','chapContent','chapImg'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('chapImgLabel').textContent = dict[currentLang].chapImgLbl;
        currentChapIdx = bookChapters.length;
        loadChapters();
      } catch (e) { alert('Lỗi: ' + e.message); } finally { btn.disabled = false; btn.textContent = dict[currentLang].chapSaveBtn; }
    }
    let allSongs = [], activePlaylist = 'All', filteredSongs = [], currentSongIdx = -1, isMusicPlaying = false;

    function getCleanYtId(rawStr) {
      let s = String(rawStr).replace('YT:', '').trim();
      if (s.includes('v=')) s = s.substring(s.indexOf('v=') + 2);
      else if (s.includes('youtu.be/')) s = s.substring(s.indexOf('youtu.be/') + 9);
      else if (s.includes('/shorts/')) s = s.substring(s.indexOf('/shorts/') + 8);
      if (s.includes('&')) s = s.substring(0, s.indexOf('&'));
      if (s.includes('?')) s = s.substring(0, s.indexOf('?'));
      if (s.includes('/')) s = s.substring(0, s.indexOf('/'));
      return s.trim();
    }

    async function loadSongs() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/songs?select=*&order=id.desc`, { headers: readHeaders });
        if (!res.ok) return;
        allSongs = await res.json();
        renderPlaylists(); renderSongs();
      } catch (e) {}
    }

    function renderPlaylists() {
      const pSet = new Set(['All']);
      allSongs.forEach(s => { if (s.playlist_name && s.playlist_name.trim()) pSet.add(s.playlist_name.trim()); });
      const bar = document.getElementById('playlistFilterBar'); bar.innerHTML = '';
      pSet.forEach(pl => {
        const chip = document.createElement('button');
        chip.className = 'tag-chip' + (activePlaylist === pl ? ' active' : '');
        chip.textContent = '🎧 ' + (pl === 'All' ? (currentLang === 'ja' ? 'すべて' : 'Tất cả') : pl);
        chip.onclick = () => { activePlaylist = pl; renderPlaylists(); renderSongs(); };
        bar.appendChild(chip);
      });
    }

    function renderSongs() {
      const feed = document.getElementById('songListFeed'); feed.innerHTML = '';
      filteredSongs = activePlaylist === 'All' ? allSongs : allSongs.filter(s => s.playlist_name && s.playlist_name.trim() === activePlaylist);
      filteredSongs.forEach((s, idx) => {
        const div = document.createElement('div'); div.className = 'song-item';
        const isYt = s.audio_url && (s.audio_url.startsWith('YT:') || s.audio_url.includes('youtu'));
        const finalLink = s.audio_url.startsWith('http') ? s.audio_url : ('https://youtube.com' + getCleanYtId(s.audio_url));
        div.innerHTML = `
          <div style="display:flex; align-items:center; gap:10px; overflow:hidden; flex:1;">
            <button class="music-btn" onclick="playSongAt(${idx})">▶</button>
            <div style="overflow:hidden; flex:1;">
              <div style="font-weight:600; font-size:0.92rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${s.title}</div>
              <div style="font-size:0.75rem; color:var(--text-muted);">${s.playlist_name || 'General'} • ${isYt ? 'YouTube (0MB)' : 'MP3 Cloud'}</div>
            </div>
          </div>
          <div style="display:flex; gap:6px; align-items:center; flex-shrink:0;">
            <a href="${finalLink}" target="_blank" rel="noopener noreferrer" class="btn-outline" style="text-decoration:none; padding:4px 8px; font-size:0.75rem;">↗ Link</a>
            <button class="btn-danger" onclick="deleteItem('songs', ${s.id}, loadSongs)">🗑️</button>
          </div>
        `;
        feed.appendChild(div);
      });
    }

    async function addSong() {
      const title = document.getElementById('songTitle').value.trim();
      const playlist = document.getElementById('songPlaylist').value.trim() || 'General';
      const ytUrl = document.getElementById('songYtUrl').value.trim();
      const file = document.getElementById('songFile').files.item(0);
      if (!title || (!ytUrl && !file)) return;
      const btn = document.getElementById('songSaveBtn'); btn.disabled = true; btn.textContent = '⏳...';
      try {
        let finalUrl = ytUrl ? ytUrl : await uploadFileToCloud(file);
        const res = await fetch(`${SUPABASE_URL}/rest/v1/songs`, { method: 'POST', headers: writeHeaders, body: JSON.stringify({ title, playlist_name: playlist, audio_url: finalUrl }) });
        if (!res.ok) throw new Error(await res.text());
        ['songTitle','songYtUrl','songFile'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('songFileLabel').textContent = dict[currentLang].songFileLbl;
        loadSongs();
      } catch (e) { alert('Lỗi: ' + e.message); } finally { btn.disabled = false; btn.textContent = dict[currentLang].songSaveBtn; }
    }

        function playSongAt(idx) {
      if (filteredSongs.length === 0) return;
      currentSongIdx = (idx + filteredSongs.length) % filteredSongs.length;
      const song = filteredSongs.at(currentSongIdx);
      const mp3 = document.getElementById('mp3Player');
      const ytBox = document.getElementById('ytHiddenBox');

      mp3.pause(); mp3.src = ''; ytBox.innerHTML = '';
      ytBox.style.cssText = 'display:none;';
      document.getElementById('miniSongTitle').textContent = '🎵 ' + song.title;
      document.getElementById('miniPlayBtn').textContent = '⏸';
      isMusicPlaying = true;

      const isYt = song.audio_url && (song.audio_url.startsWith('YT:') || song.audio_url.includes('youtu'));
      if (isYt) {
        const ytId = getCleanYtId(song.audio_url);
        const embedUrl = 'https://youtube.com' + ytId + '?autoplay=1';
        ytBox.style.cssText = 'position:fixed; top:68px; right:14px; width:270px; height:178px; z-index:999; border-radius:12px; overflow:hidden; box-shadow:0 10px 28px rgba(0,0,0,0.75); border:1.5px solid var(--primary); background:#000; display:flex; flex-direction:column;';
        ytBox.innerHTML = `
          <div id="ytDragHandle" style="background:var(--bg-card); padding:5px 10px; display:flex; justify-content:space-between; align-items:center; cursor:move; user-select:none; border-bottom:1px solid var(--border);">
            <span style="font-size:0.75rem; font-weight:600; color:var(--text-main); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">✥ ${song.title}</span>
            <button onclick="closeYtPlayer()" style="background:#ef4444; color:#fff; border:none; border-radius:6px; padding:2px 8px; font-size:0.75rem; font-weight:700; cursor:pointer; flex-shrink:0;">✕ Tắt</button>
          </div>
          <iframe style="flex:1; width:100%; border:none;" src="${embedUrl}" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        `;
        makeYtDraggable(ytBox, document.getElementById('ytDragHandle'));
      } else {
        mp3.src = song.audio_url;
        mp3.play();
      }
    }

    function closeYtPlayer() {
      const ytBox = document.getElementById('ytHiddenBox');
      ytBox.innerHTML = '';
      ytBox.style.cssText = 'display:none;';
      document.getElementById('miniPlayBtn').textContent = '▶';
      isMusicPlaying = false;
    }

    function toggleMiniPlay() {
      if (currentSongIdx === -1 && filteredSongs.length > 0) return playSongAt(0);
      if (currentSongIdx === -1) return;
      const song = filteredSongs.at(currentSongIdx);
      const mp3 = document.getElementById('mp3Player');

      if (isMusicPlaying) {
        if (song.audio_url.startsWith('YT:') || song.audio_url.includes('youtu')) closeYtPlayer();
        else { mp3.pause(); document.getElementById('miniPlayBtn').textContent = '▶'; isMusicPlaying = false; }
      } else playSongAt(currentSongIdx);
    }

    function makeYtDraggable(box, handle) {
      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
      const startDrag = (e) => {
        if (e.target.tagName === 'BUTTON') return;
        const clientX = e.touches ? e.touches.item(0).clientX : e.clientX;
        const clientY = e.touches ? e.touches.item(0).clientY : e.clientY;
        pos3 = clientX; pos4 = clientY;
        document.onmouseup = endDrag; document.onmousemove = doDrag;
        document.ontouchend = endDrag; document.ontouchmove = doDrag;
      };
      const doDrag = (e) => {
        const clientX = e.touches ? e.touches.item(0).clientX : e.clientX;
        const clientY = e.touches ? e.touches.item(0).clientY : e.clientY;
        pos1 = pos3 - clientX; pos2 = pos4 - clientY;
        pos3 = clientX; pos4 = clientY;
        box.style.top = Math.max(10, box.offsetTop - pos2) + 'px';
        box.style.left = Math.max(10, box.offsetLeft - pos1) + 'px';
        box.style.right = 'auto';
      };
      const endDrag = () => {
        document.onmouseup = null; document.onmousemove = null;
        document.ontouchend = null; document.ontouchmove = null;
      };
      handle.onmousedown = startDrag;
      handle.ontouchstart = startDrag;
    }

    let replyPrefix = '';

      replyPrefix = `↪ [${sender}: ${text.slice(0, 25)}...] `;

    let lastChatLen = 0;
    async function loadChat() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/messages?select=*&order=id.asc`, { headers: readHeaders });
        if (!res.ok) return;
        const data = await res.json();
        if (data.length === lastChatLen) return;
        lastChatLen = data.length;
        const myName = document.getElementById('chatSender').value.trim() || 'Guest';
        const box = document.getElementById('chatBox'); box.innerHTML = '';
        data.forEach(m => {
          const isMe = m.sender && m.sender === myName;
          const div = document.createElement('div');
          div.className = 'chat-msg' + (isMe ? ' me' : '');
          const safeText = (m.text || '').replace(/'/g, "\\'");
          div.onclick = (e) => { if (e.target.tagName !== 'IMG') setReply(m.sender || 'User', safeText || 'Ảnh'); };
          div.innerHTML = `<div class="chat-sender"><span>${m.sender || 'User'}</span><span>${new Date(m.created_at).toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'})}</span></div>${m.text ? `<div>${m.text}</div>` : ''}${m.image_url ? `<img src="${m.image_url}" loading="lazy" onclick="openLightbox('${m.image_url}')">` : ''}`;
          box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
      } catch (e) {}
    }

    async function sendChat() {
      const sender = document.getElementById('chatSender').value.trim() || 'Guest';
      const textInp = document.getElementById('chatText'), imgInp = document.getElementById('chatImg');
      const rawText = textInp.value.trim(), file = imgInp.files.item(0);
      if (!rawText && !file) return;
      const finalText = replyPrefix ? (replyPrefix + rawText) : rawText;
      const btn = document.getElementById('chatSendBtn'); btn.disabled = true;
      try {
        let imgUrl = file ? await uploadFileToCloud(file) : null;
        const res = await fetch(`${SUPABASE_URL}/rest/v1/messages`, { method: 'POST', headers: writeHeaders, body: JSON.stringify({ sender, text: finalText, image_url: imgUrl }) });
        if (!res.ok) throw new Error(await res.text());
        textInp.value = ''; imgInp.value = ''; cancelReply(); onChatImgPicked();
        loadChat();
      } catch (e) { alert('Lỗi: ' + e.message); } finally { btn.disabled = false; }
    }

    function updatePomoUI() {
      const m = String(Math.floor(pomoSeconds / 60)).padStart(2, '0');

      document.getElementById('pomoDisplay').textContent = `${m}:${s}`;

    function setPomoMode(mins) {
      clearInterval(pomoTimer); isPomoRunning = false;
      pomoSeconds = mins * 60;
      document.getElementById('pomoStartBtn').textContent = currentLang === 'ja' ? '▶ 開始' : '▶ Bắt đầu';
      document.getElementById('pomoStatus').textContent = mins === 25 ? (currentLang === 'ja' ? '集中モード (25分)' : 'Tập trung (25 phút)') : (currentLang === 'ja' ? '休憩モード (5分)' : 'Nghỉ ngơi (5 phút)');
      updatePomoUI();
    }
    function togglePomo() {
      const btn = document.getElementById('pomoStartBtn');
      if (isPomoRunning) { clearInterval(pomoTimer); isPomoRunning = false; btn.textContent = currentLang === 'ja' ? '▶ 再開' : '▶ Tiếp tục'; }
      else {
        isPomoRunning = true; btn.textContent = currentLang === 'ja' ? '⏸ 一時停止' : '⏸ Tạm dừng';
        pomoTimer = setInterval(() => {
          if (pomoSeconds > 0) { pomoSeconds--; updatePomoUI(); }
          else { clearInterval(pomoTimer); isPomoRunning = false; btn.textContent = '▶'; speakText(currentLang === 'ja' ? '時間になりました！' : 'Đã hết giờ!'); alert('⏰ Hết giờ!'); }
