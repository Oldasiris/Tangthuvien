<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>MySpace AI Hub</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg-main: #090d16; --bg-sidebar: #0d1320; --bg-card: rgba(17, 24, 39, 0.85);
      --bg-input: rgba(31, 41, 55, 0.85); --border: #283548; --primary: #3b82f6;
      --accent: #8b5cf6; --text-main: #f8fafc; --text-muted: #94a3b8;
      --bg-image: none; --glass: blur(12px);
    }
    :root[data-theme="light"] {
      --bg-main: #f1f5f9; --bg-sidebar: rgba(255, 255, 255, 0.9); --bg-card: rgba(255, 255, 255, 0.85);
      --bg-input: rgba(248, 250, 252, 0.9); --border: #cbd5e1; --primary: #2563eb;
      --accent: #7c3aed; --text-main: #0f172a; --text-muted: #64748b;
      --bg-image: none; --glass: blur(12px);
    }
    :root[data-theme="anime"] {
      --bg-main: #130b24; --bg-sidebar: rgba(20, 14, 38, 0.78);
      --bg-card: rgba(26, 18, 48, 0.75); --bg-input: rgba(38, 27, 68, 0.8);
      --border: rgba(244, 114, 182, 0.35); --primary: #ec4899;
      --accent: #a855f7; --text-main: #fdf2f8; --text-muted: #f9a8d4;
      --bg-image: linear-gradient(rgba(15, 10, 30, 0.6), rgba(15, 10, 30, 0.7)), url('https://unsplash.com');
      --glass: blur(14px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg-main); background-image: var(--bg-image); background-size: cover; background-position: center; background-attachment: fixed; color: var(--text-main); display: flex; height: 100dvh; overflow: hidden; transition: 0.3s; }
    .sidebar { width: 250px; background: var(--bg-sidebar); backdrop-filter: var(--glass); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 14px 10px; gap: 6px; flex-shrink: 0; transition: width 0.25s; z-index: 20; }
    .sidebar.collapsed { width: 70px; }
    .sidebar.collapsed .nav-text, .sidebar.collapsed .brand-text, .sidebar.collapsed #customBgBtn, .sidebar.collapsed .music-title, .sidebar.collapsed .quota-details { display: none !important; }
    .brand { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 12px; border-bottom: 1px solid var(--border); margin-bottom: 4px; font-weight: 700; }
    .toggle-btn { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main); width: 30px; height: 30px; border-radius: 8px; cursor: pointer; }
    .nav-item { display: flex; align-items: center; gap: 11px; padding: 10px 13px; border-radius: 12px; color: var(--text-muted); background: transparent; border: 1px solid transparent; font-size: 0.88rem; cursor: pointer; white-space: nowrap; overflow: hidden; }
    .nav-item.active { background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(236,72,153,0.18)); color: var(--primary); border-color: var(--border); font-weight: 600; }
    .quota-box { background: var(--bg-input); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; margin-top: auto; font-size: 0.75rem; }
    .quota-bar-bg { width: 100%; height: 6px; background: rgba(128,128,128,0.25); border-radius: 6px; overflow: hidden; margin-top: 5px; }
    .quota-bar-fill { height: 100%; width: 0%; background: var(--primary); transition: width 0.4s; }
    .quota-bar-fill.warn { background: #ef4444; }
    .mini-player { background: var(--bg-input); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .music-btn { background: var(--primary); color: #fff; border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 0.78rem; flex-shrink: 0; }
    .music-title { font-size: 0.78rem; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .theme-box { padding-top: 6px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 5px; }
    .theme-btns { display: flex; gap: 5px; }
    .theme-btn { flex: 1; padding: 5px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text-main); cursor: pointer; font-size: 0.75rem; font-weight: 600; }
    .theme-btn.active { border-color: var(--primary); background: var(--primary); color: #fff; }
    .bg-change-btn { width: 100%; padding: 6px; border-radius: 8px; border: 1px dashed var(--primary); background: rgba(59,130,246,0.12); color: var(--text-main); font-size: 0.76rem; cursor: pointer; display: block; font-weight: 500; }
    .main-area { flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; }
    .tab-pane { display: none; flex-direction: column; height: 100%; overflow: hidden; }
    .tab-pane.active { display: flex; }
    .top-bar { padding: 14px 20px; background: var(--bg-card); backdrop-filter: var(--glass); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .scroll-body { flex: 1; overflow-y: auto; padding: 18px 20px; }
    .box, .book-card, .media-card, .lock-card, .song-item { background: var(--bg-card); backdrop-filter: var(--glass); border: 1px solid var(--border); border-radius: 14px; padding: 15px; margin-bottom: 14px; }
    input[type="text"], input[type="password"], textarea { width: 100%; background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main); padding: 10px 13px; border-radius: 10px; font-size: 0.9rem; margin-bottom: 10px; }
    textarea { resize: vertical; min-height: 75px; }
    .row-actions { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .file-btn { background: var(--bg-input); border: 1px dashed var(--border); color: var(--text-muted); padding: 8px 12px; border-radius: 10px; font-size: 0.83rem; cursor: pointer; max-width: 230px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn { background: var(--primary); color: #fff; border: none; padding: 8px 16px; border-radius: 10px; font-weight: 600; font-size: 0.86rem; cursor: pointer; }
    .btn:disabled { opacity: 0.5; }
    .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 6px 12px; border-radius: 8px; font-size: 0.82rem; cursor: pointer; font-weight: 600; }
    .btn-danger { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); padding: 4px 10px; font-size: 0.75rem; border-radius: 8px; cursor: pointer; }
    .ai-search-bar { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; }
    .ai-search-bar input { margin-bottom: 0; border-radius: 22px; padding-left: 16px; }
    .mic-btn { background: linear-gradient(135deg, #ec4899, #8b5cf6); color: #fff; border: none; width: 42px; height: 42px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; flex-shrink: 0; box-shadow: 0 2px 10px rgba(236,72,153,0.4); }
    .mic-btn.listening { animation: pulse 1s infinite; background: #ef4444; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }
    .ai-tag-badge { font-size: 0.72rem; color: var(--accent); background: rgba(139,92,246,0.14); padding: 4px 8px; border-radius: 8px; line-height: 1.4; }
    .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 999; align-items: center; justify-content: center; padding: 20px; }
    .lightbox img { max-width: 95%; max-height: 90dvh; border-radius: 12px; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
    .lock-screen { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    .lock-card { max-width: 350px; width: 100%; padding: 26px 20px; }
    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
    .media-card { margin-bottom: 0; display: flex; flex-direction: column; gap: 8px; }
    .media-card img, .media-card video { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; background: #000; cursor: zoom-in; }
    .tag-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .tag-chip { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-muted); padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; }
    .tag-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .book-card { position: relative; }
    .book-title { font-size: 1.05rem; font-weight: 700; color: var(--primary); margin-bottom: 6px; padding-right: 50px; }
    .book-tag { background: rgba(168,85,247,0.18); color: var(--accent); padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; margin-right: 5px; display: inline-block; margin-bottom: 6px; }
    .reader-text { font-size: 1rem; line-height: 1.8; white-space: pre-wrap; padding: 10px 0; }
    .song-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 15px; margin-bottom: 10px; }
    .chat-box { flex: 1; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
    .chat-msg { max-width: 78%; background: var(--bg-card); backdrop-filter: var(--glass); border: 1px solid var(--border); padding: 9px 13px; border-radius: 15px; align-self: flex-start; }
    .chat-msg.me { background: var(--primary); color: #fff; border-color: var(--primary); align-self: flex-end; }
    .chat-sender { font-size: 0.72rem; opacity: 0.8; margin-bottom: 3px; font-weight: 600; }
    .chat-msg img { max-width: 100%; max-height: 240px; border-radius: 10px; margin-top: 6px; display: block; cursor: zoom-in; }
    .chat-footer { padding: 10px 14px; background: var(--bg-card); backdrop-filter: var(--glass); border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
    .chat-footer input[type="text"] { margin-bottom: 0; border-radius: 20px; }
    @media (max-width: 768px) {
      body { flex-direction: column; }
      .sidebar { width: 100% !important; height: 64px; flex-direction: row; padding: 4px 6px; border-right: none; border-top: 1px solid var(--border); order: 2; align-items: center; justify-content: space-between; }
      .brand, .music-title, .quota-box { display: none !important; }
      .nav-item { flex: 1; flex-direction: column; gap: 2px; padding: 4px 2px; font-size: 0.68rem; justify-content: center; }
      .nav-text { display: inline !important; }
      .mini-player { padding: 4px; border: none; background: transparent; }
      .theme-box { padding-top: 0; border-top: none; border-left: 1px solid var(--border); padding-left: 4px; }
      .bg-change-btn { padding: 3px 5px; font-size: 0.68rem; }
      .main-area { order: 1; height: calc(100dvh - 64px); }
      .scroll-body { padding: 12px; }
    }
  </style>
</head>
<body>
  <div class="lightbox" id="imgLightbox" onclick="this.style.display='none'">
    <img id="lightboxImg" src="">
  </div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-text">⚡ MySpace AI</span>
      <button class="toggle-btn" onclick="toggleMenu()">☰</button>
    </div>
    <button class="nav-item active" onclick="openTab('vault', this)"><span>🔒</span><span class="nav-text">Kho ảnh AI</span></button>
    <button class="nav-item" onclick="openTab('library', this)"><span>📚</span><span class="nav-text">Tàng thư viện</span></button>
    <button class="nav-item" onclick="openTab('music', this)"><span>🎵</span><span class="nav-text">Kho nhạc</span></button>
    <button class="nav-item" onclick="openTab('chat', this)"><span>💬</span><span class="nav-text">Phòng chat</span></button>

    <div class="quota-box" title="Dung lượng lưu trữ miễn phí (Tối đa 1GB)">
      <div class="quota-details" style="display:flex; justify-content:space-between;">
        <span>💾 Kho lưu trữ</span>
        <span id="quotaText">0 / 1024 MB</span>
      </div>
      <div class="quota-bar-bg"><div class="quota-bar-fill" id="quotaFill"></div></div>
    </div>

    <div class="mini-player">
      <button class="music-btn" id="miniPlayBtn" onclick="toggleMiniPlay()">▶</button>
      <span class="music-title" id="miniSongTitle">Chưa chọn nhạc</span>
      <button class="toggle-btn" style="width:26px; height:26px; font-size:0.75rem;" onclick="playNextSong()" title="Bài tiếp">⏭</button>
    </div>
    <div id="ytHiddenBox" style="width:0; height:0; overflow:hidden;"></div>
    <audio id="mp3Player" onended="playNextSong()"></audio>

    <div class="theme-box">
      <div class="theme-btns" style="margin-bottom:3px;">
        <button class="theme-btn active" id="lang-vi" onclick="setLang('vi')">🇻🇳 VN</button>
        <button class="theme-btn" id="lang-ja" onclick="setLang('ja')">🇯🇵 JP</button>
      </div>
      <div class="theme-btns">
        <button class="theme-btn active" id="th-dark" onclick="setTheme('dark')">🌙</button>
        <button class="theme-btn" id="th-light" onclick="setTheme('light')">☀️</button>
        <button class="theme-btn" id="th-anime" onclick="setTheme('anime')">🌸</button>
      </div>
      <button class="bg-change-btn" id="customBgBtn" onclick="changeAnimeBg()">🖼️ Đổi ảnh nền</button>
    </div>
  </aside>

  <main class="main-area">
    <section id="tab-vault" class="tab-pane active">
      <div class="top-bar">
        <h2 id="vaultHeaderTitle">🔒 Kho Ảnh AI & Tư liệu riêng</h2>
        <div style="display:flex; gap:6px;">
          <button class="btn-outline" style="padding:4px 8px; font-size:0.75rem;" onclick="setGeminiKey()" title="Cập nhật mã Gemini AI">⚙️ AI Key</button>
          <button class="btn-danger" id="lockBtn" style="display:none;" onclick="lockVault()">Khóa kho</button>
        </div>
      </div>
      <div id="vaultLockScreen" class="lock-screen">
        <div class="lock-card">
          <div style="font-size:2.2rem; margin-bottom:8px;">🛡️</div>
          <h3 style="margin-bottom:14px;">Khu vực riêng tư</h3>
          <input type="text" id="vaultUser" placeholder="Tên tài khoản...">
          <input type="password" id="pinInput" placeholder="Mã PIN bí mật..." onkeypress="if(event.key==='Enter') unlockVault()">
          <button class="btn" style="width:100%;" onclick="unlockVault()">Mở kho của tôi</button>
        </div>
      </div>
      <div id="vaultContent" class="scroll-body" style="display:none;">
        <div class="ai-search-bar">
          <input type="text" id="aiSearchInput" placeholder="Mô tả ảnh bạn nhớ mang máng (VD: mèo vàng, bầu trời, code...)" oninput="filterVaultByAI()">
          <button class="mic-btn" id="voiceMicBtn" onclick="startVoiceSearch()" title="Nói để tìm ảnh bằng giọng nói">🎙️</button>
        </div>
        <div id="aiVoiceStatus" style="font-size:0.8rem; color:var(--primary); margin-bottom:12px; display:none;"></div>

        <div class="box">
          <input type="text" id="vaultNote" placeholder="Ghi chú thêm (AI sẽ tự động phân tích & gắn nhãn ảnh cho bạn)...">
          <div class="row-actions">
            <label for="vaultFile" class="file-btn" id="vaultFileLabel">📎 Chọn 1 hoặc nhiều ảnh/video</label>
            <input type="file" id="vaultFile" accept="image/*,video/*" multiple onchange="showMultiNames()">
            <button class="btn" id="vaultSaveBtn" onclick="uploadVault()">Lưu & Phân tích AI</button>
          </div>
        </div>
        <div class="media-grid" id="vaultFeed"></div>
      </div>
    </section>
    <section id="tab-library" class="tab-pane">
      <div class="top-bar">
        <h2 id="libHeaderTitle">📚 Tàng thư viện</h2>
        <button class="btn-outline" id="backToBooksBtn" style="display:none;" onclick="closeReader()">← Danh sách truyện</button>
      </div>
      <div id="libraryListView" class="scroll-body">
        <div class="box">
          <input type="text" id="bookTitle" placeholder="Tên bộ truyện...">
          <input type="text" id="bookTags" placeholder="Tag thể loại (VD: Tiên hiệp, Hành động, Anime)">
          <textarea id="bookSummary" placeholder="Tóm tắt cơ bản..."></textarea>
          <textarea id="bookReview" placeholder="Review & Đánh giá..."></textarea>
          <div class="row-actions">
            <label for="bookFile" class="file-btn" id="bookFileLabel">🖼️ Ảnh bìa / File đính kèm</label>
            <input type="file" id="bookFile" onchange="showName('bookFile','bookFileLabel','🖼️ Ảnh bìa / File đính kèm')">
            <button class="btn" id="bookSaveBtn" onclick="addBook()">Tạo bộ truyện</button>
          </div>
        </div>
        <div class="tag-bar" id="tagFilterBar"></div>
        <div id="libraryFeed"></div>
      </div>
      <div id="chapterReaderView" class="scroll-body" style="display:none;">
        <div class="box">
          <h4 style="margin-bottom:10px; color:var(--primary);">➕ Thêm chương / trang mới</h4>
          <input type="text" id="chapTitle" placeholder="Tên chương (VD: Chương 1)">
          <textarea id="chapContent" placeholder="Dán nội dung chữ (hoặc để trống nếu đăng trang ảnh)..."></textarea>
          <div class="row-actions">
            <label for="chapImg" class="file-btn" id="chapImgLabel">🖼️ Hoặc chọn trang ảnh truyện</label>
            <input type="file" id="chapImg" accept="image/*" onchange="showName('chapImg','chapImgLabel','🖼️ Hoặc chọn trang ảnh truyện')">
            <button class="btn" id="chapSaveBtn" onclick="addChapter()">Đăng chương</button>
          </div>
        </div>
        <div id="chapterListBar" class="tag-bar"></div>
        <div class="box" id="chapterDisplayBox" style="display:none;">
          <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:12px;">
            <h3 id="currentChapHeading" style="color:var(--primary);"></h3>
            <button class="btn-danger" id="delChapBtn">Xóa chương</button>
          </div>
          <div id="currentChapMedia"></div>
          <div id="currentChapText" class="reader-text"></div>
          <div style="display:flex; justify-content:space-between; margin-top:20px; padding-top:12px; border-top:1px solid var(--border);">
            <button class="btn-outline" onclick="navChapter(-1)">← Chương trước</button>
            <button class="btn-outline" onclick="navChapter(1)">Chương sau →</button>
          </div>
        </div>
      </div>
    </section>

    <section id="tab-music" class="tab-pane">
      <div class="top-bar">
        <h2>🎵 Kho nhạc & Playlist</h2>
        <span id="mobileQuotaBadge" style="font-size:0.75rem; color:var(--text-muted);"></span>
      </div>
      <div class="scroll-body">
        <div class="box">
          <input type="text" id="songTitle" placeholder="Tên bài hát...">
          <input type="text" id="songPlaylist" placeholder="Tên Playlist (VD: Anime Chill, Nhạc đọc truyện, Remix)">
          <input type="text" id="songYtUrl" placeholder="Dán link YouTube (Tốn 0MB dung lượng)...">
          <div class="row-actions">
            <label for="songFile" class="file-btn" id="songFileLabel">🎧 Hoặc tải file MP3 lên kho</label>
            <input type="file" id="songFile" accept="audio/*" onchange="showName('songFile','songFileLabel','🎧 Hoặc tải file MP3 lên kho')">
            <button class="btn" id="songSaveBtn" onclick="addSong()">Thêm bài hát</button>
          </div>
        </div>
        <div class="tag-bar" id="playlistFilterBar"></div>
        <div id="songListFeed"></div>
      </div>
    </section>

    <section id="tab-chat" class="tab-pane">
      <div class="top-bar">
        <h2>💬 Phòng chat</h2>
        <input type="text" id="chatSender" placeholder="Tên của bạn..." onchange="saveChatName()" style="width:130px; margin:0; padding:6px 10px; font-size:0.82rem;">
      </div>
      <div class="chat-box" id="chatBox"></div>
      <div class="chat-footer">
        <label for="chatImg" class="file-btn" id="chatImgLabel" style="padding:8px 12px;">🖼️</label>
        <input type="file" id="chatImg" accept="image/*" onchange="showName('chatImg','chatImgLabel','🖼️')">
        <input type="text" id="chatText" placeholder="Nhắn tin..." onkeypress="if(event.key==='Enter') sendChat()">
        <button class="btn" id="chatSendBtn" onclick="sendChat()">Gửi</button>
      </div>
    </section>
  </main>
  <script>
    const SUPABASE_URL = 'https://supabase.co';
    const SUPABASE_KEY = 'sb_publishable_5EPRnZi4GIUK0LVGGYtzRw_osHnjeCm';
    let GEMINI_KEY = localStorage.getItem('myspace_gemini_key') || '';
    let currentLang = localStorage.getItem('myspace_lang') || 'vi';

    const readHeaders = { 'apikey': SUPABASE_KEY };
    const writeHeaders = { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' };

    function setGeminiKey() {
      const msg = currentLang === 'ja' ? 'Google Gemini API Keyを入力してください：' : 'Dán mã Google Gemini API Key của bạn vào đây:';
      const k = prompt(msg, GEMINI_KEY);
      if (k !== null && k.trim()) {
        GEMINI_KEY = k.trim();
        localStorage.setItem('myspace_gemini_key', GEMINI_KEY);
        alert(currentLang === 'ja' ? 'APIキーを保存しました！' : 'Đã lưu mã AI Key!');
      }
    }

    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('imgLightbox').style.display = 'flex';
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',').pop());
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function analyzeImageWithAI(file) {
      if (!file || !file.type.startsWith('image/')) return currentLang === 'ja' ? '動画 / メディア' : 'Video / Tệp đa phương tiện';
      try {
        const base64Data = await fileToBase64(file);
        const promptText = currentLang === 'ja'
          ? "この画像を日本語で簡潔に説明してください（背景、主な物体、色、人物、雰囲気、文字などを含め、後で検索しやすいようにカンマ区切りのキーワード形式で出力してください）。"
          : "Hãy mô tả ngắn gọn bức ảnh này bằng tiếng Việt (gồm: bối cảnh, đồ vật chính, màu sắc, nhân vật, cảm xúc và chữ viết nếu có) dưới dạng các từ khóa tự nhiên cách nhau dấu phẩy để dễ tìm kiếm lại sau này.";

        const res = await fetch(`https://googleapis.com{encodeURIComponent(GEMINI_KEY)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }, { inline_data: { mime_type: file.type, data: base64Data } }] }]
          })
        });
        if (!res.ok) return file.name;
        const data = await res.json();
        const cand = data.candidates ? data.candidates.at(0) : null;
        const part = cand && cand.content && cand.content.parts ? cand.content.parts.at(0) : null;
        return (part && part.text) ? part.text.trim() : file.name;
      } catch (e) {
        return file.name;
      }
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = (currentLang === 'ja') ? 'ja-JP' : 'vi-VN';
        utter.rate = 1.05;
        window.speechSynthesis.speak(utter);
      }
    }

    function startVoiceSearch() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) return alert(currentLang === 'ja' ? 'Chromeブラウザをご利用ください。' : 'Hãy dùng trình duyệt Chrome để sử dụng Micro giọng nói nhé!');
      const rec = new SpeechRec();
      rec.lang = (currentLang === 'ja') ? 'ja-JP' : 'vi-VN';
      const btn = document.getElementById('voiceMicBtn');
      const status = document.getElementById('aiVoiceStatus');

      btn.classList.add('listening');
      status.style.display = 'block';
      status.textContent = (currentLang === 'ja')
        ? '🎙️ 聞いています... 探したい写真の特徴を話してください'
        : '🎙️ Đang nghe... Hãy nói mô tả ảnh bạn cần tìm';

      rec.onresult = (event) => {
        const spoken = event.results.item(0).item(0).transcript;
        const cleanQuery = (currentLang === 'ja')
          ? spoken.replace(/(の写真を探して|を探して|を見せて|検索)\s*/g, '').trim()
          : spoken.replace(/^(tìm cho tôi|tìm ảnh|kiếm ảnh|mở ảnh|cho xem ảnh|tìm)\s*/i, '').trim();

        const isAll = ['tất cả', 'すべて', '全部'].includes(cleanQuery.toLowerCase());
        document.getElementById('aiSearchInput').value = isAll ? '' : cleanQuery;
        const count = filterVaultByAI();

        const reply = (currentLang === 'ja')
          ? `「${cleanQuery}」に一致する写真が${count}件見つかりました`
          : `Đã tìm thấy ${count} kết quả cho từ khóa ${cleanQuery}`;
        status.textContent = `🤖 AI: "${reply}" (${spoken})`;
        speakText(reply);
      };

      rec.onerror = () => {
        status.textContent = (currentLang === 'ja') ? '⚠️ 音声を認識できませんでした。もう一度お試しください。' : '⚠️ Không nghe rõ giọng nói, bạn thử bấm Micro nói lại nhé.';
      };
      rec.onend = () => btn.classList.remove('listening');
      rec.start();
    }
    async function checkStorageQuota() {
      try {
        const res = await fetch(`${SUPABASE_URL}/storage/v1/object/list/media`, {
          method: 'POST', headers: writeHeaders, body: JSON.stringify({ limit: 1000, offset: 0 })
        });
        if (!res.ok) return;
        const files = await res.json();
        let totalBytes = 0;
        files.forEach(f => { if (f.metadata && f.metadata.size) totalBytes += f.metadata.size; });
        const usedMB = (totalBytes / (1024 * 1024)).toFixed(1);
        const percent = Math.min(100, (usedMB / 1024) * 100).toFixed(1);
        document.getElementById('quotaText').textContent = `${usedMB} / 1024 MB`;
        document.getElementById('mobileQuotaBadge').textContent = `💾 ${usedMB}MB / 1GB`;
        const fill = document.getElementById('quotaFill');
        fill.style.width = percent + '%';
        if (percent >= 80) fill.classList.add('warn');
      } catch (e) {}
    }

    async function uploadFileToCloud(file) {
      if (!file || !file.name) throw new Error('Invalid file');
      if (file.size > 50 * 1024 * 1024) throw new Error('File > 50MB!');
      const safeName = Date.now() + '_' + Math.random().toString(36).substring(2,6) + '_' + file.name.replace(/[^a-zA-Z0-9.]/g, '_');
      const res = await fetch(`${SUPABASE_URL}/storage/v1/object/media/${safeName}`, {
        method: 'POST', headers: { 'apikey': SUPABASE_KEY, 'Content-Type': file.type || 'application/octet-stream' }, body: file
      });
      if (!res.ok) throw new Error(await res.text());
      checkStorageQuota();
      return `${SUPABASE_URL}/storage/v1/object/public/media/${safeName}`;
    }

    function getCleanYtId(rawStr) {
      let s = String(rawStr).replace('YT:', '').trim();
      if (s.includes('v=')) s = s.substring(s.indexOf('v=') + 2);
      else if (s.includes('youtu.be/')) s = s.substring(s.indexOf('youtu.be/') + 9);
      else if (s.includes('/shorts/')) s = s.substring(s.indexOf('/shorts/') + 8);
      if (s.includes('&')) s = s.substring(0, s.indexOf('&'));
      if (s.includes('?')) s = s.substring(0, s.indexOf('?'));
      if (s.includes('/')) s = s.substring(0, s.indexOf('/'));
      return s.trim();
    }

    function playSongAt(idx) {
      if (filteredSongs.length === 0) return;
      currentSongIdx = (idx + filteredSongs.length) % filteredSongs.length;
      const song = filteredSongs[currentSongIdx];
      const mp3 = document.getElementById('mp3Player');
      const ytBox = document.getElementById('ytHiddenBox');

      mp3.pause(); mp3.src = ''; ytBox.innerHTML = '';
      ytBox.style = 'width:0; height:0; overflow:hidden;';
      document.getElementById('miniSongTitle').textContent = '🎵 ' + song.title;
      document.getElementById('miniPlayBtn').textContent = '⏸';
      isMusicPlaying = true;

      const isYt = song.audio_url && (song.audio_url.startsWith('YT:') || song.audio_url.includes('youtu'));
      if (isYt) {
        const ytId = getCleanYtId(song.audio_url);
        ytBox.style = 'position:fixed; bottom:72px; right:14px; width:260px; height:150px; z-index:99; border-radius:12px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,0.6); border:1px solid var(--primary); background:#000;';
        ytBox.innerHTML = `
          <button onclick="toggleMiniPlay()" style="position:absolute; top:4px; right:4px; background:rgba(0,0,0,0.75); color:#fff; border:none; border-radius:50%; width:24px; height:24px; cursor:pointer; z-index:10;">✕</button>
          <iframe width="100%" height="100%" src="https://youtube.com{ytId}?autoplay=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        `;
      } else {
        mp3.src = song.audio_url;
        mp3.play();
      }
    }

    function toggleMiniPlay() {
      if (currentSongIdx === -1 && filteredSongs.length > 0) return playSongAt(0);
      if (currentSongIdx === -1) return;
      const song = filteredSongs[currentSongIdx];
      const mp3 = document.getElementById('mp3Player');
      const ytBox = document.getElementById('ytHiddenBox');

      if (isMusicPlaying) {
        if (song.audio_url.startsWith('YT:') || song.audio_url.includes('youtu')) {
          ytBox.innerHTML = '';
          ytBox.style = 'width:0; height:0; overflow:hidden;';
        } else mp3.pause();
        document.getElementById('miniPlayBtn').textContent = '▶';
        isMusicPlaying = false;
      } else {
        playSongAt(currentSongIdx);
      }
    }

    function playNextSong() { if (filteredSongs.length > 0) playSongAt(currentSongIdx + 1); }

    document.getElementById('chatSender').value = localStorage.getItem('myspace_username') || '';
    function saveChatName() {
      const name = document.getElementById('chatSender').value.trim();
      if (name) localStorage.setItem('myspace_username', name);
      lastChatLen = -1; loadChat();
    }

    let lastChatLen = 0;
    async function loadChat() {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/messages?select=*&order=id.asc`, { headers: readHeaders });
      if (!res.ok) return;
      const data = await res.json();
      if (data.length === lastChatLen) return;
      lastChatLen = data.length;
      const myName = document.getElementById('chatSender').value.trim() || 'Guest';
      const box = document.getElementById('chatBox'); box.innerHTML = '';
      data.forEach(m => {
        const isMe = m.sender && m.sender === myName;
        const div = document.createElement('div');
        div.className = 'chat-msg' + (isMe ? ' me' : '');
        div.innerHTML = `<div class="chat-sender">${m.sender || 'User'} • ${new Date(m.created_at).toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'})}</div>${m.text ? `<div>${m.text}</div>` : ''}${m.image_url ? `<img src="${m.image_url}" loading="lazy" onclick="openLightbox('${m.image_url}')">` : ''}`;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    async function sendChat() {
      const sender = document.getElementById('chatSender').value.trim() || 'Guest';
      const textInp = document.getElementById('chatText'), imgInp = document.getElementById('chatImg');
      const text = textInp.value.trim(), file = imgInp.files.item(0);
      if (!text && !file) return;
      const btn = document.getElementById('chatSendBtn'); btn.disabled = true;
      try {
        let imgUrl = file ? await uploadFileToCloud(file) : null;
        const res = await fetch(`${SUPABASE_URL}/rest/v1/messages`, { method: 'POST', headers: writeHeaders, body: JSON.stringify({ sender, text, image_url: imgUrl }) });
        if (!res.ok) throw new Error(await res.text());
        textInp.value = ''; imgInp.value = ''; showName('chatImg','chatImgLabel','🖼️');
        loadChat();
      } catch (e) { alert(e.message); } finally { btn.disabled = false; }
    }

    async function deleteItem(table, id, reloadFn) {
      if (!confirm('Delete?')) return;
      await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, { method: 'DELETE', headers: writeHeaders });
      reloadFn(); checkStorageQuota();
