<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kho Lưu Trữ & Chat Online</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #121212; color: #e0e0e0; display: flex; height: 100vh; overflow: hidden; }
    .storage-section { flex: 2; padding: 20px; overflow-y: auto; border-right: 1px solid #2c2c2c; }
    h2 { margin-bottom: 15px; color: #4da6ff; font-size: 1.3rem; }
    .upload-box { background: #1e1e1e; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #333; }
    textarea { width: 100%; height: 80px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 10px; resize: none; margin-bottom: 10px; }
    .controls { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    button { background: #4da6ff; color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:disabled { background: #555; cursor: not-allowed; }
    .feed { display: flex; flex-direction: column; gap: 15px; }
    .card { background: #1e1e1e; padding: 15px; border-radius: 10px; border: 1px solid #2c2c2c; position: relative; }
    .card p { white-space: pre-wrap; line-height: 1.5; margin-bottom: 10px; }
    .card img, .card video { max-width: 100%; max-height: 400px; border-radius: 8px; display: block; margin-top: 8px; }
    .card .time { font-size: 0.75rem; color: #888; margin-top: 8px; display: block; }
    .delete-btn { position: absolute; top: 12px; right: 12px; background: #ff4d4d; color: white; padding: 4px 8px; font-size: 0.75rem; }
    .chat-section { flex: 1; display: flex; flex-direction: column; background: #181818; min-width: 300px; }
    .chat-header { padding: 15px 20px; background: #1e1e1e; border-bottom: 1px solid #2c2c2c; font-weight: bold; color: #4da6ff; }
    .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 0.95rem; background: #2a2a2a; color: #fff; align-self: flex-start; }
    .chat-input-area { padding: 15px; background: #1e1e1e; border-top: 1px solid #2c2c2c; display: flex; gap: 10px; }
    .chat-input-area input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; }
  </style>
</head>
<body>

  <div class="storage-section">
    <h2>📁 Kho Lưu Trữ Đám Mây</h2>
    <div class="upload-box">
      <textarea id="textInput" placeholder="Viết ghi chú hoặc đoạn văn..."></textarea>
      <div class="controls">
        <input type="file" id="fileInput" accept="image/*,video/*">
        <button id="saveBtn" onclick="addPost()">Lưu lên mây</button>
      </div>
    </div>
    <div class="feed" id="feed"></div>
  </div>

  <div class="chat-section">
    <div class="chat-header">💬 Phòng Chat Online</div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
      <input type="text" id="chatInput" placeholder="Nhập tin nhắn..." onkeypress="if(event.key==='Enter') sendMessage()">
      <button onclick="sendMessage()">Gửi</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://pasqbzlazciysmecmkbu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_5EPRnZi4GIUK0LVGGYtzRw_osHnjeCm';

    const headers = {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json'
    };

    // 1. Tải danh sách bài viết
    async function loadPosts() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/posts?select=*&order=id.desc`, { headers });
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();

        const feed = document.getElementById('feed');
        feed.innerHTML = '';
        data.forEach(item => {
          const card = document.createElement('div');
          card.className = 'card';
          let mediaHTML = '';
          if (item.media_url) {
            if (item.media_type && item.media_type.startsWith('image/')) {
              mediaHTML = `<img src="${item.media_url}">`;
            } else if (item.media_type && item.media_type.startsWith('video/')) {
              mediaHTML = `<video src="${item.media_url}" controls></video>`;
            }
          }
          card.innerHTML = `
            <button class="delete-btn" onclick="deletePost(${item.id})">Xóa</button>
            ${item.content ? `<p>${item.content}</p>` : ''}
            ${mediaHTML}
            <span class="time">${new Date(item.created_at).toLocaleString('vi-VN')}</span>
          `;
          feed.appendChild(card);
        });
      } catch (err) {
        console.error('Lỗi tải bài:', err.message);
      }
    }

    // 2. Đăng bài mới kèm ảnh/video
    async function addPost() {
      const text = document.getElementById('textInput').value.trim();
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];
      const btn = document.getElementById('saveBtn');

      if (!text && !file) return alert('Nhập chữ hoặc chọn file trước nhé!');
      if (file && file.size > 50 * 1024 * 1024) {
        return alert('File quá nặng! Gói miễn phí chỉ hỗ trợ file dưới 50MB.');
      }

      btn.disabled = true;
      btn.textContent = 'Đang tải lên...';

      try {
        let mediaUrl = null;
        let mediaType = null;

        if (file) {
          const fileName = Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9.]/g, '_');
          const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/media/${fileName}`, {
            method: 'POST',
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': 'Bearer ' + SUPABASE_KEY,
              'Content-Type': file.type
            },
            body: file
          });
          if (!uploadRes.ok) throw new Error('Lỗi tải file lên Storage: ' + await uploadRes.text());

          mediaUrl = `${SUPABASE_URL}/storage/v1/object/public/media/${fileName}`;
          mediaType = file.type;
        }

        const insertRes = await fetch(`${SUPABASE_URL}/rest/v1/posts`, {
          method: 'POST',
          headers,
          body: JSON.stringify({ content: text, media_url: mediaUrl, media_type: mediaType })
        });
        if (!insertRes.ok) throw new Error('Lỗi lưu bài viết: ' + await insertRes.text());

        document.getElementById('textInput').value = '';
        fileInput.value = '';
        await loadPosts();
      } catch (err) {
        alert(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Lưu lên mây';
      }
    }

    // 3. Xóa bài viết
    async function deletePost(id) {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/posts?id=eq.${id}`, {
          method: 'DELETE',
          headers
        });
        if (!res.ok) throw new Error(await res.text());
        loadPosts();
      } catch (err) {
        alert('Lỗi xóa bài: ' + err.message);
      }
    }

    // 4. Xử lý Chat
    async function loadMessages() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/messages?select=*&order=id.asc`, { headers });
        if (!res.ok) return;
        const data = await res.json();

        const box = document.getElementById('chatMessages');
        box.innerHTML = '';
        data.forEach(m => {
          const div = document.createElement('div');
          div.className = 'msg';
          div.textContent = m.text;
          box.appendChild(div);
        });
        box.scrollTop = box.scrollHeight;
      } catch (err) {
        console.error('Lỗi tải tin nhắn:', err.message);
      }
    }

    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/messages`, {
          method: 'POST',
          headers,
          body: JSON.stringify({ text: text })
        });
        if (!res.ok) throw new Error(await res.text());
        loadMessages();
      } catch (err) {
        alert('Không gửi được tin nhắn: ' + err.message);
      }
    }

    setInterval(loadMessages, 2000);
    loadPosts();
    loadMessages();
  </script>
</body>
</html>
