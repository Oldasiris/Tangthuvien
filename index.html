<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MySpace Hub — Anime & Cloud</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
      --bg-main: #090d16; --bg-sidebar: #0d1320; --bg-card: #111827;
      --bg-input: #1f2937; --border: #283548; --primary: #3b82f6;
      --accent: #8b5cf6; --text-main: #f8fafc; --text-muted: #94a3b8;
      --bg-image: none; --glass: none;
    }
    :root[data-theme="light"] {
      --bg-main: #f1f5f9; --bg-sidebar: #ffffff; --bg-card: #ffffff;
      --bg-input: #f8fafc; --border: #cbd5e1; --primary: #2563eb;
      --accent: #7c3aed; --text-main: #0f172a; --text-muted: #64748b;
      --bg-image: none; --glass: none;
    }
    :root[data-theme="anime"] {
      --bg-main: #130b24; --bg-sidebar: rgba(20, 14, 38, 0.78);
      --bg-card: rgba(26, 18, 48, 0.72); --bg-input: rgba(38, 27, 68, 0.75);
      --border: rgba(244, 114, 182, 0.35); --primary: #ec4899;
      --accent: #a855f7; --text-main: #fdf2f8; --text-muted: #f9a8d4;
      --bg-image: linear-gradient(rgba(15, 10, 30, 0.6), rgba(15, 10, 30, 0.7)), url('https://unsplash.com');
      --glass: blur(14px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body {
      background-color: var(--bg-main); background-image: var(--bg-image);
      background-size: cover; background-position: center; background-attachment: fixed;
      color: var(--text-main); display: flex; height: 100dvh; overflow: hidden; transition: 0.3s;
    }
    .sidebar {
      width: 240px; background: var(--bg-sidebar); backdrop-filter: var(--glass);
      border-right: 1px solid var(--border); display: flex; flex-direction: column;
      padding: 16px 12px; gap: 8px; flex-shrink: 0; transition: width 0.25s; z-index: 20;
    }
    .sidebar.collapsed { width: 72px; }
    .sidebar.collapsed .nav-text, .sidebar.collapsed .brand-text, .sidebar.collapsed .theme-title, .sidebar.collapsed #customBgBtn { display: none !important; }
    .brand { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 16px; border-bottom: 1px solid var(--border); margin-bottom: 6px; font-weight: 700; }
    .toggle-btn { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main); width: 32px; height: 32px; border-radius: 8px; cursor: pointer; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; color: var(--text-muted); background: transparent; border: 1px solid transparent; font-size: 0.92rem; cursor: pointer; white-space: nowrap; overflow: hidden; }
    .nav-item.active { background: linear-gradient(135deg, rgba(59,130,246,0.2), rgba(236,72,153,0.18)); color: var(--primary); border-color: var(--border); font-weight: 600; }
    .theme-box { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
    .theme-title { font-size: 0.72rem; text-transform: uppercase; color: var(--text-muted); padding-left: 8px; font-weight: 600; }
    .theme-btns { display: flex; gap: 6px; justify-content: center; }
    .theme-btn { flex: 1; padding: 7px 6px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text-main); cursor: pointer; }
    .theme-btn.active { border-color: var(--primary); background: var(--primary); color: #fff; }
    .bg-change-btn { width: 100%; padding: 7px; border-radius: 8px; border: 1px dashed var(--primary); background: rgba(236,72,153,0.12); color: var(--text-main); font-size: 0.78rem; cursor: pointer; margin-top: 4px; display: none; }
    .main-area { flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; }
    .tab-pane { display: none; flex-direction: column; height: 100%; overflow: hidden; }
    .tab-pane.active { display: flex; }
    .top-bar { padding: 15px 22px; background: var(--bg-card); backdrop-filter: var(--glass); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .scroll-body { flex: 1; overflow-y: auto; padding: 20px 22px; }
    .box, .book-card, .media-card, .lock-card { background: var(--bg-card); backdrop-filter: var(--glass); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 18px; }
    input[type="text"], input[type="password"], textarea { width: 100%; background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main); padding: 10px 14px; border-radius: 10px; font-size: 0.92rem; margin-bottom: 10px; }
    textarea { resize: vertical; min-height: 75px; }
    .row-actions { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .file-btn { background: var(--bg-input); border: 1px dashed var(--border); color: var(--text-muted); padding: 8px 14px; border-radius: 10px; font-size: 0.85rem; cursor: pointer; max-width: 230px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn { background: var(--primary); color: #fff; border: none; padding: 9px 18px; border-radius: 10px; font-weight: 600; cursor: pointer; }
    .btn:disabled { opacity: 0.5; }
    .btn-danger { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); padding: 4px 10px; font-size: 0.75rem; border-radius: 8px; cursor: pointer; }
    .lock-screen { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; text-align: center; }
    .lock-card { max-width: 340px; width: 100%; padding: 28px 22px; }
    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
    .media-card { margin-bottom: 0; display: flex; flex-direction: column; gap: 8px; }
    .media-card img, .media-card video { width: 100%; height: 210px; object-fit: cover; border-radius: 10px; background: #000; }
    .tag-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .tag-chip { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-muted); padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; }
    .tag-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .book-card { position: relative; }
    .book-title { font-size: 1.05rem; font-weight: 700; color: var(--primary); margin-bottom: 6px; padding-right: 50px; }
    .book-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .book-tag { background: rgba(168,85,247,0.18); color: var(--accent); padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; }
    .book-label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-top: 8px; }
    .book-text { font-size: 0.9rem; line-height: 1.5; white-space: pre-wrap; margin-top: 2px; }
    .chat-box { flex: 1; overflow-y: auto; padding: 16px 22px; display: flex; flex-direction: column; gap: 12px; }
    .chat-msg { max-width: 78%; background: var(--bg-card); backdrop-filter: var(--glass); border: 1px solid var(--border); padding: 10px 14px; border-radius: 16px; align-self: flex-start; }
    .chat-msg.me { background: var(--primary); color: #fff; border-color: var(--primary); align-self: flex-end; }
    .chat-sender { font-size: 0.72rem; opacity: 0.8; margin-bottom: 4px; font-weight: 600; }
    .chat-msg img { max-width: 100%; max-height: 250px; border-radius: 10px; margin-top: 6px; display: block; }
    .chat-footer { padding: 12px 16px; background: var(--bg-card); backdrop-filter: var(--glass); border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
    .chat-footer input[type="text"] { margin-bottom: 0; border-radius: 20px; }
    @media (max-width: 768px) {
      body { flex-direction: column; }
      .sidebar { width: 100% !important; height: 64px; flex-direction: row; padding: 6px 8px; border-right: none; border-top: 1px solid var(--border); order: 2; align-items: center; justify-content: space-between; }
      .brand, .theme-title { display: none !important; }
      .nav-item { flex: 1; flex-direction: column; gap: 2px; padding: 6px 2px; font-size: 0.72rem; justify-content: center; }
      .nav-text { display: inline !important; }
      .theme-box { margin-top: 0; padding-top: 0; border-top: none; border-left: 1px solid var(--border); padding-left: 6px; }
      .bg-change-btn { padding: 4px 6px; font-size: 0.7rem; margin-top: 2px; }
      .main-area { order: 1; height: calc(100dvh - 64px); }
      .scroll-body { padding: 14px; }
    }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-text">⚡ MySpace Hub</span>
      <button class="toggle-btn" onclick="toggleMenu()">☰</button>
    </div>
    <button class="nav-item active" onclick="openTab('vault', this)"><span>🔒</span><span class="nav-text">Tư liệu cá nhân</span></button>
    <button class="nav-item" onclick="openTab('library', this)"><span>📚</span><span class="nav-text">Tàng thư viện</span></button>
    <button class="nav-item" onclick="openTab('chat', this)"><span>💬</span><span class="nav-text">Phòng chat</span></button>
    <div class="theme-box">
      <div class="theme-title">Giao diện</div>
      <div class="theme-btns">
        <button class="theme-btn active" id="th-dark" onclick="setTheme('dark')">🌙</button>
        <button class="theme-btn" id="th-light" onclick="setTheme('light')">☀️</button>
        <button class="theme-btn" id="th-anime" onclick="setTheme('anime')">🌸</button>
      </div>
      <button class="bg-change-btn" id="customBgBtn" onclick="changeAnimeBg()">🖼️ Đổi ảnh nền</button>
    </div>
  </aside>

  <main class="main-area">
    <section id="tab-vault" class="tab-pane active">
      <div class="top-bar">
        <h2>🔒 Tư liệu cá nhân</h2>
        <button class="btn-danger" id="lockBtn" style="display:none;" onclick="lockVault()">Khóa lại</button>
      </div>
      <div id="vaultLockScreen" class="lock-screen">
        <div class="lock-card">
          <div style="font-size:2.4rem; margin-bottom:10px;">🛡️</div>
          <h3 style="margin-bottom:14px;">Khu vực bảo mật</h3>
          <input type="password" id="pinInput" placeholder="Nhập mã truy cập..." onkeypress="if(event.key==='Enter') unlockVault()">
          <button class="btn" style="width:100%;" onclick="unlockVault()">Mở khóa</button>
        </div>
      </div>
      <div id="vaultContent" class="scroll-body" style="display:none;">
        <div class="box">
          <input type="text" id="vaultNote" placeholder="Ghi chú ngắn cho ảnh hoặc video...">
          <div class="row-actions">
            <label for="vaultFile" class="file-btn" id="vaultFileLabel">📎 Chọn ảnh / video</label>
            <input type="file" id="vaultFile" accept="image/*,video/*" onchange="showName('vaultFile','vaultFileLabel','📎 Chọn ảnh / video')">
            <button class="btn" id="vaultSaveBtn" onclick="uploadVault()">Lưu tư liệu</button>
          </div>
        </div>
        <div class="media-grid" id="vaultFeed"></div>
      </div>
    </section>

    <section id="tab-library" class="tab-pane">
      <div class="top-bar"><h2>📚 Tàng thư viện</h2></div>
      <div class="scroll-body">
        <div class="box">
          <input type="text" id="bookTitle" placeholder="Tên truyện / tác phẩm...">
          <input type="text" id="bookTags" placeholder="Tag thể loại (VD: Tiên hiệp, Hành động, Anime)">
          <textarea id="bookSummary" placeholder="Tóm tắt cơ bản nội dung..."></textarea>
          <textarea id="bookReview" placeholder="Review & Đánh giá của bạn..."></textarea>
          <div class="row-actions">
            <label for="bookFile" class="file-btn" id="bookFileLabel">📄 Đính kèm file truyện / ảnh bìa</label>
            <input type="file" id="bookFile" onchange="showName('bookFile','bookFileLabel','📄 Đính kèm file truyện / ảnh bìa')">
            <button class="btn" id="bookSaveBtn" onclick="addBook()">Thêm vào thư viện</button>
          </div>
        </div>
        <div class="tag-bar" id="tagFilterBar"></div>
        <div id="libraryFeed"></div>
      </div>
    </section>

    <section id="tab-chat" class="tab-pane">
      <div class="top-bar">
        <h2>💬 Phòng chat</h2>
        <input type="text" id="chatSender" placeholder="Tên của bạn..." style="width:130px; margin:0; padding:6px 10px; font-size:0.82rem;">
      </div>
      <div class="chat-box" id="chatBox"></div>
      <div class="chat-footer">
        <label for="chatImg" class="file-btn" id="chatImgLabel" style="padding:8px 12px;">🖼️</label>
        <input type="file" id="chatImg" accept="image/*" onchange="showName('chatImg','chatImgLabel','🖼️')">
        <input type="text" id="chatText" placeholder="Nhắn tin..." onkeypress="if(event.key==='Enter') sendChat()">
        <button class="btn" id="chatSendBtn" onclick="sendChat()">Gửi</button>
      </div>
    </section>
  </main>
  <script>
    const SUPABASE_URL = 'https://pasqbzlazciysmecmkbu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_5EPRnZi4GIUK0LVGGYtzRw_osHnjeCm';
    const VAULT_PIN = '1234';

    const headers = { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' };

    function applyCustomBg() {
      const customUrl = localStorage.getItem('myspace_anime_bg');
      if (customUrl && document.documentElement.getAttribute('data-theme') === 'anime') {
        document.documentElement.style.setProperty('--bg-image', `linear-gradient(rgba(15, 10, 30, 0.55), rgba(15, 10, 30, 0.65)), url('${customUrl}')`);
      } else {
        document.documentElement.style.removeProperty('--bg-image');
      }
    }

    function changeAnimeBg() {
      const current = localStorage.getItem('myspace_anime_bg') || '';
      const newUrl = prompt('Dán đường link (URL) hình nền Anime của bạn vào đây (để trống để về mặc định):', current);
      if (newUrl === null) return;
      if (newUrl.trim()) localStorage.setItem('myspace_anime_bg', newUrl.trim());
      else localStorage.removeItem('myspace_anime_bg');
      applyCustomBg();
    }

    function setTheme(themeName) {
      document.documentElement.setAttribute('data-theme', themeName);
      localStorage.setItem('myspace_theme', themeName);
      document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
      const btn = document.getElementById('th-' + themeName);
      if (btn) btn.classList.add('active');
      document.getElementById('customBgBtn').style.display = (themeName === 'anime') ? 'block' : 'none';
      applyCustomBg();
    }

    function toggleMenu() {
      const sb = document.getElementById('sidebar');
      sb.classList.toggle('collapsed');
      localStorage.setItem('myspace_collapsed', sb.classList.contains('collapsed'));
    }

    setTheme(localStorage.getItem('myspace_theme') || 'dark');
    if (localStorage.getItem('myspace_collapsed') === 'true') document.getElementById('sidebar').classList.add('collapsed');

    function openTab(tabName, el) {
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById('tab-' + tabName).classList.add('active');
      el.classList.add('active');
      if (tabName === 'chat') document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
    }

    function showName(inputId, labelId, defaultText) {
      const file = document.getElementById(inputId).files.item(0);
      document.getElementById(labelId).textContent = file ? ('✅ ' + file.name) : defaultText;
    }

    async function uploadFileToCloud(file) {
      if (!file || !file.name) throw new Error('Không đọc được tệp!');
      if (file.size > 50 * 1024 * 1024) throw new Error('File vượt quá 50MB!');
      const safeName = Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9.]/g, '_');
      const res = await fetch(`${SUPABASE_URL}/storage/v1/object/media/${safeName}`, {
        method: 'POST', headers: { 'apikey': SUPABASE_KEY, 'Content-Type': file.type || 'application/octet-stream' }, body: file
      });
      if (!res.ok) throw new Error('Lỗi tải file: ' + await res.text());
      return `${SUPABASE_URL}/storage/v1/object/public/media/${safeName}`;
    }

    function unlockVault() {
      if (document.getElementById('pinInput').value === VAULT_PIN) {
        document.getElementById('vaultLockScreen').style.display = 'none';
        document.getElementById('vaultContent').style.display = 'block';
        document.getElementById('lockBtn').style.display = 'inline-block';
        document.getElementById('pinInput').value = '';
        loadVault();
      } else alert('Sai mã truy cập!');
    }

    function lockVault() {
      document.getElementById('vaultLockScreen').style.display = 'flex';
      document.getElementById('vaultContent').style.display = 'none';
      document.getElementById('lockBtn').style.display = 'none';
    }

    async function loadVault() {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/posts?select=*&order=id.desc`, { headers: { 'apikey': SUPABASE_KEY } });
      if (!res.ok) return;
      const data = await res.json();
      const feed = document.getElementById('vaultFeed');
      feed.innerHTML = '';
      data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'media-card';
        const media = item.media_url ? ((item.media_type && item.media_type.startsWith('video/')) ? `<video src="${item.media_url}" controls playsinline></video>` : `<img src="${item.media_url}" loading="lazy">`) : '';
        div.innerHTML = `${media}${item.content ? `<p style="font-size:0.88rem;">${item.content}</p>` : ''}<div style="display:flex; justify-content:space-between; align-items:center;"><span style="font-size:0.72rem; color:var(--text-muted);">${new Date(item.created_at).toLocaleDateString('vi-VN')}</span><button class="btn-danger" onclick="deleteItem('posts', ${item.id}, loadVault)">Xóa</button></div>`;
        feed.appendChild(div);
      });
    }

    async function uploadVault() {
      const note = document.getElementById('vaultNote').value.trim();
      const file = document.getElementById('vaultFile').files.item(0);
      if (!note && !file) return alert('Chọn ảnh/video hoặc nhập ghi chú!');
      const btn = document.getElementById('vaultSaveBtn');
      btn.disabled = true; btn.textContent = 'Đang lưu...';
      try {
        let url = null, type = null;
        if (file) { url = await uploadFileToCloud(file); type = file.type; }
        const res = await fetch(`${SUPABASE_URL}/rest/v1/posts`, { method: 'POST', headers, body: JSON.stringify({ content: note, media_url: url, media_type: type }) });
        if (!res.ok) throw new Error(await res.text());
        document.getElementById('vaultNote').value = ''; document.getElementById('vaultFile').value = '';
        showName('vaultFile','vaultFileLabel','📎 Chọn ảnh / video');
        loadVault();
      } catch (e) { alert(e.message); }
      finally { btn.disabled = false; btn.textContent = 'Lưu tư liệu'; }
    }
    let allBooks = [], activeTag = 'Tất cả';

    async function loadLibrary() {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/library?select=*&order=id.desc`, { headers: { 'apikey': SUPABASE_KEY } });
      if (!res.ok) return;
      allBooks = await res.json();
      renderTags(); renderBooks();
    }

    function renderTags() {
      const tagSet = new Set(['Tất cả']);
      allBooks.forEach(b => { if (b.tags) b.tags.split(',').forEach(t => { if (t.trim()) tagSet.add(t.trim()); }); });
      const bar = document.getElementById('tagFilterBar');
      bar.innerHTML = '';
      tagSet.forEach(tag => {
        const chip = document.createElement('button');
        chip.className = 'tag-chip' + (activeTag === tag ? ' active' : '');
        chip.textContent = tag;
        chip.onclick = () => { activeTag = tag; renderTags(); renderBooks(); };
        bar.appendChild(chip);
      });
    }

    function renderBooks() {
      const feed = document.getElementById('libraryFeed');
      feed.innerHTML = '';
      const filtered = activeTag === 'Tất cả' ? allBooks : allBooks.filter(b => b.tags && b.tags.toLowerCase().includes(activeTag.toLowerCase()));
      filtered.forEach(b => {
        const tagsHTML = (b.tags || '').split(',').filter(t => t.trim()).map(t => `<span class="book-tag">#${t.trim()}</span>`).join('');
        const div = document.createElement('div');
        div.className = 'book-card';
        div.innerHTML = `<button class="btn-danger" style="position:absolute; top:14px; right:14px;" onclick="deleteItem('library', ${b.id}, loadLibrary)">Xóa</button><div class="book-title">${b.title || 'Chưa đặt tên'}</div><div class="book-tags">${tagsHTML}</div>${b.summary ? `<div class="book-label">Tóm tắt</div><div class="book-text">${b.summary}</div>` : ''}${b.review ? `<div class="book-label">Review & Đánh giá</div><div class="book-text">${b.review}</div>` : ''}${b.file_url ? `<div style="margin-top:10px;"><a href="${b.file_url}" target="_blank" style="color:var(--primary); font-size:0.85rem; text-decoration:none;">📥 Mở tệp / Ảnh bìa đính kèm</a></div>` : ''}`;
        feed.appendChild(div);
      });
    }

    async function addBook() {
      const title = document.getElementById('bookTitle').value.trim();
      const tags = document.getElementById('bookTags').value.trim();
      const summary = document.getElementById('bookSummary').value.trim();
      const review = document.getElementById('bookReview').value.trim();
      const file = document.getElementById('bookFile').files.item(0);
      if (!title) return alert('Hãy nhập tên truyện!');
      const btn = document.getElementById('bookSaveBtn');
      btn.disabled = true; btn.textContent = 'Đang lưu...';
      try {
        let fileUrl = null;
        if (file) fileUrl = await uploadFileToCloud(file);
        const res = await fetch(`${SUPABASE_URL}/rest/v1/library`, { method: 'POST', headers, body: JSON.stringify({ title, tags, summary, review, file_url: fileUrl }) });
        if (!res.ok) throw new Error(await res.text());
        document.getElementById('bookTitle').value = ''; document.getElementById('bookTags').value = '';
        document.getElementById('bookSummary').value = ''; document.getElementById('bookReview').value = '';
        document.getElementById('bookFile').value = '';
        showName('bookFile','bookFileLabel','📄 Đính kèm file truyện / ảnh bìa');
        loadLibrary();
      } catch (e) { alert(e.message); }
      finally { btn.disabled = false; btn.textContent = 'Thêm vào thư viện'; }
    }

    let lastChatLen = 0;
    async function loadChat() {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/messages?select=*&order=id.asc`, { headers: { 'apikey': SUPABASE_KEY } });
      if (!res.ok) return;
      const data = await res.json();
      if (data.length === lastChatLen) return;
      lastChatLen = data.length;
      const myName = document.getElementById('chatSender').value.trim() || 'Ẩn danh';
      const box = document.getElementById('chatBox');
      box.innerHTML = '';
      data.forEach(m => {
        const isMe = m.sender && m.sender === myName;
        const div = document.createElement('div');
        div.className = 'chat-msg' + (isMe ? ' me' : '');
        div.innerHTML = `<div class="chat-sender">${m.sender || 'Thành viên'} • ${new Date(m.created_at).toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'})}</div>${m.text ? `<div>${m.text}</div>` : ''}${m.image_url ? `<img src="${m.image_url}" loading="lazy">` : ''}`;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    async function sendChat() {
      const sender = document.getElementById('chatSender').value.trim() || 'Ẩn danh';
      const textInp = document.getElementById('chatText');
      const imgInp = document.getElementById('chatImg');
      const text = textInp.value.trim();
      const file = imgInp.files.item(0);
      if (!text && !file) return;
      const btn = document.getElementById('chatSendBtn');
      btn.disabled = true;
      try {
        let imgUrl = null;
        if (file) imgUrl = await uploadFileToCloud(file);
        const res = await fetch(`${SUPABASE_URL}/rest/v1/messages`, { method: 'POST', headers, body: JSON.stringify({ sender, text, image_url: imgUrl }) });
        if (!res.ok) throw new Error(await res.text());
        textInp.value = ''; imgInp.value = '';
        showName('chatImg','chatImgLabel','🖼️');
        loadChat();
      } catch (e) { alert('Lỗi gửi tin: ' + e.message); }
      finally { btn.disabled = false; }
    }

    async function deleteItem(table, id, reloadFn) {
      if (!confirm('Xác nhận xóa mục này?')) return;
      await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, { method: 'DELETE', headers });
      reloadFn();
    }

    loadLibrary();
    loadChat();
    setInterval(loadChat, 2500);
  </script>
</body>
</html>
